<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>الأجهزة - الورشة الفنية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#172033}
header{background:#07152f;color:#fff;padding:22px 16px}
.wrap{max-width:1100px;margin:auto;padding:16px}
header .wrap{padding:0}
h1{margin:0 0 7px} header p{margin:0;color:#dbe5ff}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
h2{margin:0 0 14px;color:#07152f}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin:5px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd4de;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;cursor:pointer}
.primary{background:#16803c;color:#fff}.blue{background:#1769aa;color:#fff}.gray{background:#596273;color:#fff}.danger{background:#d60000;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:130px}
.notice{display:none;padding:11px;border-radius:10px;margin-bottom:12px}
.good{background:#e2f5e8;color:#146c2e}.bad{background:#ffe2e2;color:#a00000}
.search{display:grid;grid-template-columns:1fr auto;gap:8px}
.list{display:grid;gap:10px}
.item{border:1px solid #e0e5eb;border-radius:13px;padding:14px}
.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{margin:0 0 7px;color:#07152f}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef1f5;margin:2px;font-size:12px}
.green{background:#e3f7e9;color:#146c2e}.orange{background:#fff0d6;color:#8b5b00}.red{background:#ffe2e2;color:#a00000}.bb{background:#e4f0ff;color:#1769aa}
.mini{font-size:13px;color:#667085;line-height:1.8}
.item-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.item-actions button{padding:8px 11px}
.details{margin-top:12px;background:#f8fafc;border-radius:10px;padding:10px}
.rel-row{display:flex;justify-content:space-between;border-bottom:1px solid #e4e8ed;padding:8px 0;gap:10px}
.rel-row:last-child{border:0}
.empty{text-align:center;color:#777;padding:20px}
.back{display:block;text-align:center;background:#333;color:#fff;text-decoration:none;border-radius:10px;padding:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.search{grid-template-columns:1fr}.item-head{display:block}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>📱 أجهزة العملاء</h1>
<p>تسجيل أجهزة العملاء وربطها مباشرة بملفات العملاء وطلبات الصيانة</p>
</div></header>

<div class="wrap">
<div id="notice" class="notice"></div>

<div class="card">
<h2>➕ تسجيل / تعديل جهاز</h2>
<input type="hidden" id="deviceId">
<div class="grid">
<div class="full">
<label>العميل *</label>
<select id="customerId"><option value="">اختر العميل</option></select>
</div>
<div>
<label>نوع الجهاز *</label>
<select id="type">
<option value="">اختر نوع الجهاز</option>
<option>ثلاجة</option><option>ديب فريزر</option>
<option>غسالة أوتوماتيك</option><option>غسالة فوق أوتوماتيك</option>
<option>غسالة نصف أوتوماتيك</option><option>تكييف سبليت</option>
<option>تكييف شباك</option><option>سخان مياه</option>
<option>سخان غاز</option><option>كولدير</option>
<option>بوتاجاز</option><option>أخرى</option>
</select>
</div>
<div><label>الماركة *</label><input id="brand" placeholder="مثال: شارب"></div>
<div><label>الموديل</label><input id="model"></div>
<div><label>الرقم المسلسل</label><input id="serial"></div>
<div><label>القدرة / السعة</label><input id="capacity" placeholder="مثال: 1.5 حصان / 14 قدم"></div>
<div><label>نوع الغاز / الفريون</label><input id="refrigerant" placeholder="مثال: R22 / R410 / R290"></div>
<div><label>سنة الشراء</label><input id="purchaseYear" type="number" min="1900" max="2100"></div>
<div><label>حالة الجهاز</label>
<select id="condition"><option value="يعمل">يعمل</option><option value="يعمل بعطل">يعمل بعطل</option><option value="متوقف">متوقف</option><option value="غير معروف">غير معروف</option></select>
</div>
<div><label>مكان الجهاز</label><input id="location" placeholder="مثال: المطبخ"></div>
<div class="full"><label>ملاحظات فنية</label><textarea id="notes" placeholder="أي معلومات مهمة عن الجهاز أو تاريخه"></textarea></div>
</div>
<div class="actions">
<button class="primary" id="saveBtn">💾 حفظ الجهاز</button>
<button class="gray" id="clearBtn">↩️ تفريغ النموذج</button>
</div>
</div>

<div class="card">
<h2>🔎 البحث في الأجهزة</h2>
<div class="search">
<input id="search" placeholder="ابحث بالعميل أو الماركة أو الموديل أو الرقم المسلسل أو نوع الجهاز">
<button class="blue" id="searchBtn">بحث</button>
</div>
</div>

<div class="card">
<h2>📋 الأجهزة المسجلة <span id="count" class="badge bb"></span></h2>
<div id="list" class="list"></div>
</div>

<a class="back" href="index.html">🏠 العودة إلى لوحة التحكم</a>
</div>

<script src="app-core.js"></script>
<script>
(function(){
"use strict";
const C=window.WorkshopCore;
const $=id=>document.getElementById(id);

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function show(msg,error=false){$("notice").textContent=msg;$("notice").className="notice "+(error?"bad":"good");$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",2800)}
function devices(){return C.list(C.KEYS.devices)}
function idOf(d){return C.idOf(d)}
function makeId(){return C.nextId("DEV-",C.KEYS.devices,5)}
function customerName(id){const c=C.findCustomer(id);return c?C.customerName(c):"عميل غير معروف"}

function loadCustomers(){
 const select=$("customerId");
 const current=select.value;
 let arr=C.list(C.KEYS.customers);

 if(!Array.isArray(arr)) arr=[];

 select.innerHTML='<option value="">اختر العميل</option>';

 arr.forEach(c=>{
  const cid=idOf(c);
  if(!cid)return;

  const opt=document.createElement("option");
  opt.value=cid;
  opt.textContent=(C.customerName(c)||"بدون اسم")+" — "+(c.phone||c.mobile||cid);
  select.appendChild(opt);
 });

 if(current)select.value=current;

 if(!arr.length){
  select.innerHTML='<option value="">لا يوجد عملاء مسجلون</option>';
 }
}

function clearForm(){
 ["deviceId","brand","model","serial","capacity","refrigerant","purchaseYear","location","notes"].forEach(id=>$(id).value="");
 $("customerId").value="";$("type").value="";$("condition").value="يعمل";
 $("saveBtn").textContent="💾 حفظ الجهاز";
 window.scrollTo({top:0,behavior:"smooth"});
}

function editDevice(id){
 const d=C.findDevice(id);if(!d)return;
 $("deviceId").value=id;$("customerId").value=d.customerId||d.clientId||"";
 $("type").value=d.type||d.deviceType||"";$("brand").value=d.brand||"";
 $("model").value=d.model||"";$("serial").value=d.serial||d.serialNumber||"";
 $("capacity").value=d.capacity||"";$("refrigerant").value=d.refrigerant||d.gas||"";
 $("purchaseYear").value=d.purchaseYear||"";$("condition").value=d.condition||"غير معروف";
 $("location").value=d.location||"";$("notes").value=d.notes||"";
 $("saveBtn").textContent="✏️ حفظ التعديل";
 window.scrollTo({top:0,behavior:"smooth"});
}

function saveDevice(){
 const customerId=$("customerId").value,type=$("type").value,brand=$("brand").value.trim(),oldId=$("deviceId").value.trim();
 if(!customerId){show("اختر العميل أولًا.",true);return}
 if(!type||!brand){show("نوع الجهاز والماركة مطلوبان.",true);return}

 const data={
  customerId,customerName:customerName(customerId),type,deviceType:type,brand,
  model:$("model").value.trim(),serial:$("serial").value.trim(),
  serialNumber:$("serial").value.trim(),capacity:$("capacity").value.trim(),
  refrigerant:$("refrigerant").value.trim(),purchaseYear:$("purchaseYear").value.trim(),
  condition:$("condition").value,location:$("location").value.trim(),
  notes:$("notes").value.trim(),updatedAt:C.now()
 };
 let arr=devices();

 if(oldId){
  const i=arr.findIndex(d=>String(idOf(d))===String(oldId));
  if(i<0){show("الجهاز غير موجود.",true);return}
  arr[i]=Object.assign({},arr[i],data,{id:oldId});
  C.write(C.KEYS.devices,arr);C.log("تعديل","الأجهزة",oldId,"تم تعديل بيانات الجهاز");
  show("تم تعديل بيانات الجهاز بنجاح.");
 }else{
  const id=makeId();
  arr.push(Object.assign({id,createdAt:C.now()},data));
  C.write(C.KEYS.devices,arr);
  C.log("إضافة","الأجهزة",id,"تم تسجيل جهاز جديد للعميل "+customerName(customerId));
  show("تم تسجيل الجهاز وربطه بالعميل بنجاح.");
 }
 clearForm();render();
}

function deleteDevice(id){
 const d=C.findDevice(id);if(!d)return;
 const cid=d.customerId||d.clientId||"";
 const linked=C.customerRequests(cid).filter(r=>String(r.deviceId||r.applianceId||"")===String(id)).length;
 let msg="هل تريد حذف الجهاز "+(d.type||"الجهاز")+" — "+(d.brand||"")+"؟";
 if(linked)msg+="\n\nتنبيه: الجهاز مرتبط بـ "+linked+" طلب صيانة. سيتم حذف سجل الجهاز فقط ولن نحذف طلبات الصيانة.";
 if(!confirm(msg))return;
 C.write(C.KEYS.devices,devices().filter(x=>String(idOf(x))!==String(id)));
 C.log("حذف","الأجهزة",id,"تم حذف سجل الجهاز");show("تم حذف الجهاز.");render();
}

function viewDevice(id){
 const d=C.findDevice(id);if(!d)return;
 const cid=d.customerId||d.clientId||"";
 const requests=C.customerRequests(cid).filter(r=>String(r.deviceId||r.applianceId||"")===String(id));
 const visits=requests.flatMap(r=>C.requestVisits(idOf(r)));
 const old=document.getElementById("device-details-"+id);
 if(old){old.remove();return}

 const box=document.createElement("div");
 box.id="device-details-"+id;box.className="details";
 box.innerHTML=`
 <div class="rel-row"><span>👤 العميل</span><b>${esc(customerName(cid))}</b></div>
 <div class="rel-row"><span>🔧 طلبات الصيانة</span><b>${requests.length}</b></div>
 <div class="rel-row"><span>📅 الزيارات المرتبطة</span><b>${visits.length}</b></div>
 <div class="rel-row"><span>📋 الطلبات</span><span>
 ${requests.length?requests.slice(-5).reverse().map(r=>`<span class="badge bb">${esc(idOf(r))} — ${esc(r.status||"جديد")}</span>`).join(""):'<span class="mini">لا توجد طلبات مرتبطة.</span>'}
 </span></div>`;
 const item=document.querySelector('[data-device-id="'+CSS.escape(id)+'"]');
 if(item)item.appendChild(box);
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 let arr=devices();
 if(q)arr=arr.filter(d=>[
  idOf(d),d.customerName,customerName(d.customerId||d.clientId),d.type,d.deviceType,d.brand,
  d.model,d.serial,d.serialNumber,d.capacity,d.refrigerant,d.location
 ].join(" ").toLowerCase().includes(q));

 $("count").textContent=arr.length+" جهاز";
 if(!arr.length){$("list").innerHTML='<div class="empty">لا توجد أجهزة مطابقة.</div>';return}

 $("list").innerHTML=arr.map(d=>{
  const id=idOf(d),cid=d.customerId||d.clientId||"";
  const rq=C.customerRequests(cid).filter(r=>String(r.deviceId||r.applianceId||"")===String(id));
  return `
  <div class="item" data-device-id="${esc(id)}">
   <div class="item-head">
    <div>
     <h3>📱 ${esc(d.type||d.deviceType||"جهاز")} — ${esc(d.brand||"")}</h3>
     <div class="mini">
      🆔 ${esc(id)}<br>
      👤 ${esc(customerName(cid))}<br>
      📞 ${esc((C.findCustomer(cid)||{}).phone||"—")}<br>
      ${d.model?"🔢 الموديل: "+esc(d.model)+"<br>":""}
      ${d.serial?"🔖 المسلسل: "+esc(d.serial)+"<br>":""}
      ${d.capacity?"⚡ القدرة/السعة: "+esc(d.capacity)+"<br>":""}
      ${d.refrigerant?"❄️ الغاز/الفريون: "+esc(d.refrigerant)+"<br>":""}
      ${d.location?"📍 المكان: "+esc(d.location):""}
     </div>
    </div>
    <div>
     <span class="badge bb">طلبات ${rq.length}</span>
     <span class="badge ${d.condition==="يعمل"?"green":d.condition==="متوقف"?"red":"orange"}">${esc(d.condition||"غير معروف")}</span>
    </div>
   </div>
   <div class="item-actions">
    <button class="blue" onclick="viewDeviceGlobal('${esc(id)}')">👁️ التفاصيل</button>
    <button class="gray" onclick="editDeviceGlobal('${esc(id)}')">✏️ تعديل</button>
    <button class="danger" onclick="deleteDeviceGlobal('${esc(id)}')">🗑️ حذف</button>
   </div>
  </div>`;
 }).join("");
}

window.editDeviceGlobal=editDevice;
window.deleteDeviceGlobal=deleteDevice;
window.viewDeviceGlobal=viewDevice;

$("saveBtn").onclick=saveDevice;$("clearBtn").onclick=clearForm;$("searchBtn").onclick=render;
$("search").addEventListener("input",render);

try{
 C.syncRelations();
 loadCustomers();
 render();

 if(C.list(C.KEYS.customers).length===0){
   show("لم يتم العثور على عملاء في بيانات النظام.",true);
 }
}catch(e){
 show("حدث خطأ أثناء تحميل بيانات الأجهزة: "+(e.message||e),true);
 console.error(e);
}
})();
</script>
</body>
</html>
