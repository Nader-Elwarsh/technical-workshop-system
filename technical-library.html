<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f"><link rel="manifest" href="manifest.json">
<title>📚 المكتبة الفنية - الورشة الفنية</title><script src="app-core.js?v=4.7.0-unified"></script><script src="twms-ui.js?v=4.7.0"></script>
<style>body{font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#172033;margin:0}header{background:#07152f;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px rgba(0,0,0,.06)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e7ebf0;text-align:right}.empty{text-align:center;color:#777;padding:20px}a{color:#1769aa;text-decoration:none}.back{display:inline-block;margin-top:8px;background:#fff;padding:8px 12px;border-radius:8px}</style>
</head><body><header><h1 style="margin:0">📚 المكتبة الفنية</h1><a class="back" href="index.html">← لوحة التحكم</a></header><main>
<div class="card"><div id="summary"></div></div><div class="card"><div id="table"></div></div></main>
<script>
(function(){
 const C=window.WorkshopCore,A=window.TWMS_ACTOR||{id:"LOCAL-ADMIN",name:"المدير",role:"admin"};
 const key=C.KEYS["technicalLibrary"]; const rows=C.list(key);
 const esc=window.TWMSUI.escape;
 document.getElementById("summary").innerHTML="<b>إجمالي السجلات: "+rows.length+"</b>";
 if(!rows.length){document.getElementById("table").innerHTML='<div class="empty">لا توجد بيانات حاليًا.</div>';return;}
 const fields=["id", "title", "category", "updatedAt"];
 document.getElementById("table").innerHTML="<table><thead><tr>"+fields.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+
 rows.map(r=>"<tr>"+fields.map(x=>"<td>"+esc(r[x]??"")+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body></html>
