<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الورشة الفنية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #07152f;
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: #222;
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 12px;
        }

        .card h2 {
            margin: 8px 0;
            color: #07152f;
            font-size: 24px;
        }

        .card p {
            margin: 0;
            color: #666;
            font-size: 16px;
        }

        .footer {
            margin-top: 35px;
            background: #07152f;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .footer h2 {
            margin: 0 0 10px;
        }

        .footer p {
            margin: 0;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 26px;
            }

            .card {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>الورشة الفنية 🔧</h1>
        <p>نظام إدارة الورشة لصيانة الأجهزة المنزلية والتكييف</p>
    </header>

    <main class="container">

        <div class="dashboard">

            <!-- العملاء -->
            <a href="customers.html" class="card">
                <div class="icon">👥</div>

                <h2>العملاء</h2>

                <p>
                    إدارة العملاء وتسجيل بياناتهم
                </p>
            </a>

            <!-- طلبات الصيانة -->
            <a href="requests.html" class="card">
                <div class="icon">🔧</div>

                <h2>طلبات الصيانة</h2>

                <p>
                    تسجيل وإدارة طلبات الصيانة
                </p>
            </a>

        </div>

    </main>

    <footer class="footer">
        <h2>الورشة الفنية 👥</h2>
        <p>صيانة الأجهزة المنزلية والتكييف</p>
    </footer>

</body>

</html>
