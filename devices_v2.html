<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الأجهزة - الورشة الفنية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#172033}
header{background:#07152f;color:#fff;text-align:center;padding:22px 15px}header h1{margin:0 0 7px}header p{margin:0;color:#dbe5ff}
.container{max-width:1150px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
h2{margin:0 0 15px;color:#07152f}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin:8px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd4de;border-radius:10px;font:inherit}textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;cursor:pointer}.primary{background:#16803c;color:#fff}.blue{background:#1769aa;color:#fff}.gray{background:#596273;color:#fff}.danger{background:#d60000;color:#fff}.orange{background:#a96600;color:#fff}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:#f8fafc;border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#07152f}
.device{border:1px solid #dfe4ea;border-radius:14px;padding:15px;margin-top:10px}.device h3{margin:0 0 8px;color:#07152f}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e9edf2;margin:3px;font-size:12px}.ok{background:#e3f7e9;color:#146c2e}.warn{background:#fff0d6;color:#8b5b00}.bad{background:#ffe2e2;color:#a00000}
.notice{display:none;padding:12px;border-radius:10px;margin-bottom:12px}.good{background:#e1f5e7;color:#146c2e}.error{background:#ffe2e2;color:#a00000}.info{background:#eef6ff;border:1px solid #cfe2ff;border-radius:10px;padding:11px;line-height:1.8;margin-top:10px}.empty{text-align:center;color:#777;padding:28px}.hidden{display:none!important}
.back{display:block;text-align:center;background:#333;color:#fff;text-decoration:none;padding:14px;border-radius:10px}
.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{background:#f8fafc;padding:10px;border-radius:10px}
.timeline{border-right:3px solid #1769aa;padding-right:12px;margin-top:10px}.event{margin:0 0 12px}.event b{display:block}
@media(max-width:700px){.grid,.filters,.checkgrid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.actions{flex-direction:column}}
</style>
</head>
<body>
<header><h1>🔧 إدارة الأجهزة</h1><p>الورشة الفنية لصيانة الأجهزة المنزلية والتكييف</p></header>
<div class="container">
<div id="notice" class="notice"></div>

<div class="card">
<h2>📊 ملخص الأجهزة</h2>
<div class="stats">
<div class="stat"><b id="total">0</b>إجمالي الأجهزة</div>
<div class="stat"><b id="active">0</b>نشطة</div>
<div class="stat"><b id="maintenance">0</b>تحتاج صيانة</div>
<div class="stat"><b id="warranty">0</b>داخل الضمان</div>
<div class="stat"><b id="contracts">0</b>مرتبطة بعقود</div>
</div>
</div>

<div class="card">
<h2 id="formTitle">➕ إضافة جهاز</h2>
<div class="grid">
<div><label>رقم الجهاز</label><input id="deviceId" readonly></div>
<div><label>العميل *</label><select id="customer"><option value="">اختر العميل</option></select></div>
<div><label>نوع الجهاز *</label><select id="type"><option>ثلاجة</option><option>فريزر</option><option>غسالة أوتوماتيك</option><option>غسالة فوق أوتوماتيك</option><option>غسالة نصف أوتوماتيك</option><option>تكييف سبليت</option><option>تكييف شباك</option><option>تكييف فري ستاند</option><option>سخان مياه</option><option>سخان غاز</option><option>كولدير</option><option>أخرى</option></select></div>
<div><label>الماركة *</label><input id="brand"></div>
<div><label>الموديل</label><input id="model"></div>
<div><label>الرقم التسلسلي</label><input id="serial"></div>
<div><label>سنة الصنع</label><input id="year" type="number" min="1900" max="2100"></div>
<div><label>تاريخ الشراء</label><input id="purchaseDate" type="date"></div>
<div><label>مصدر الشراء</label><input id="purchaseSource" placeholder="المحل / الشركة / غير ذلك"></div>
<div><label>حالة الجهاز</label><select id="status"><option>يعمل</option><option>يحتاج صيانة</option><option>متوقف</option><option>خارج الخدمة</option><option>مباع</option><option>مؤرشف</option></select></div>
<div><label>مكان الجهاز</label><input id="location" placeholder="منزل العميل / فرع / موقع آخر"></div>
<div><label>رقم الضمان</label><input id="warrantyId"></div>
<div><label>رابط صورة الجهاز</label><input id="photo" placeholder="رابط اختياري"></div>
<div class="full"><label>وصف الجهاز / ملاحظات عامة</label><textarea id="notes"></textarea></div>
<div class="full"><label>حالة الجهاز الفنية</label><textarea id="technicalStatus" placeholder="آخر حالة فنية معروفة للجهاز"></textarea></div>
<div class="full"><label>ملحقات ومواصفات إضافية</label><textarea id="specs"></textarea></div>
</div>
<div class="actions"><button class="primary" id="save">💾 حفظ الجهاز</button><button class="gray hidden" id="cancel">إلغاء التعديل</button></div>
</div>

<div class="card">
<h2>🔎 البحث والتصفية</h2>
<div class="filters">
<input id="search" placeholder="رقم الجهاز / العميل / الماركة / الموديل / السيريال...">
<select id="filterCustomer"><option value="">كل العملاء</option></select>
<select id="filterType"><option value="">كل الأنواع</option></select>
</div>
<div id="list"></div>
</div>

<div class="card">
<h2>🧾 سجل الجهاز</h2>
<div id="history"><div class="empty">اختر جهازًا من القائمة لعرض سجله.</div></div>
</div>

<a class="back" href="index.html">🏠 العودة إلى الرئيسية</a>
</div>

<script>
const KEY="devices",CUSTOMERS="customers",REQ="maintenanceRequests",WAR="warranties",CON="contracts",INV="invoices",HIST="deviceHistory";
let editing=null,selectedDevice=null;
const $=id=>document.getElementById(id);
const arr=k=>{try{let x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const today=()=>new Date().toISOString().slice(0,10);
function notice(t,bad=false){$("notice").textContent=t;$("notice").className="notice "+(bad?"error":"good");$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",3000)}
function nextId(){let n=0;arr(KEY).forEach(d=>{let m=String(d.id||"").match(/^DEV-(\d+)$/);if(m)n=Math.max(n,+m[1])});return"DEV-"+String(n+1).padStart(5,"0")}
function cid(c){return c.id||c.customerId||c.code||""}function cname(c){return c.name||c.fullName||c.customerName||"بدون اسم"}
function loadCustomers(selected="",filter=false){
 let cs=arr(CUSTOMERS),opts=cs.map(c=>'<option value="'+esc(cid(c))+'">'+esc(cname(c))+' — '+esc(c.phone||c.mobile||"")+'</option>').join("");
 if(filter){$("filterCustomer").innerHTML='<option value="">كل العملاء</option>'+opts}else{$("customer").innerHTML='<option value="">اختر العميل</option>'+opts;if(selected)$("customer").value=selected}
}
function types(){return["ثلاجة","فريزر","غسالة أوتوماتيك","غسالة فوق أوتوماتيك","غسالة نصف أوتوماتيك","تكييف سبليت","تكييف شباك","تكييف فري ستاند","سخان مياه","سخان غاز","كولدير","أخرى"]}
function loadTypes(){let o=types().map(x=>'<option>'+x+'</option>').join("");$("filterType").innerHTML='<option value="">كل الأنواع</option>'+o}
function reset(){editing=null;$("formTitle").textContent="➕ إضافة جهاز";$("save").textContent="💾 حفظ الجهاز";$("cancel").classList.add("hidden");$("deviceId").value=nextId();loadCustomers();$("type").value="ثلاجة";["brand","model","serial","year","purchaseDate","purchaseSource","location","warrantyId","photo","notes","technicalStatus","specs"].forEach(x=>$(x).value="");$("status").value="يعمل"}
function saveDevice(){
 let customer=$("customer").value,brand=$("brand").value.trim();if(!customer||!brand){notice("اختر العميل واكتب الماركة",true);return}
 let all=arr(KEY),old=editing?all.find(x=>String(x.id)===String(editing)):null,c=arr(CUSTOMERS).find(x=>String(cid(x))===String(customer)),now=new Date().toISOString();
 let d={id:editing||nextId(),customerId:customer,customerName:cname(c||{}),customerPhone:(c||{}).phone||(c||{}).mobile||"",type:$("type").value,brand,model:$("model").value.trim(),serialNumber:$("serial").value.trim(),year:$("year").value,purchaseDate:$("purchaseDate").value,purchaseSource:$("purchaseSource").value.trim(),status:$("status").value,location:$("location").value.trim(),warrantyId:$("warrantyId").value.trim(),photo:$("photo").value.trim(),notes:$("notes").value.trim(),technicalStatus:$("technicalStatus").value.trim(),specs:$("specs").value.trim(),createdAt:old?.createdAt||now,updatedAt:now};
 let i=all.findIndex(x=>String(x.id)===String(d.id));if(i>=0)all[i]=d;else all.unshift(d);save(KEY,all);
 let hs=arr(HIST);hs.unshift({id:"HIST-"+Date.now(),deviceId:d.id,customerId:d.customerId,event:editing?"تعديل بيانات الجهاز":"إضافة جهاز",details:"تم حفظ بيانات الجهاز",date:now});save(HIST,hs);
 notice(editing?"تم تعديل الجهاز":"تم إضافة الجهاز");reset();renderAll()
}
function editDevice(id){
 let d=arr(KEY).find(x=>String(x.id)===String(id));if(!d)return;
 editing=d.id;$("formTitle").textContent="✏️ تعديل الجهاز";$("save").textContent="💾 حفظ التعديل";$("cancel").classList.remove("hidden");$("deviceId").value=d.id;loadCustomers(d.customerId);$("type").value=d.type||"ثلاجة";$("brand").value=d.brand||"";$("model").value=d.model||"";$("serial").value=d.serialNumber||d.serial||"";$("year").value=d.year||"";$("purchaseDate").value=d.purchaseDate||"";$("purchaseSource").value=d.purchaseSource||"";$("status").value=d.status||"يعمل";$("location").value=d.location||"";$("warrantyId").value=d.warrantyId||"";$("photo").value=d.photo||"";$("notes").value=d.notes||"";$("technicalStatus").value=d.technicalStatus||"";$("specs").value=d.specs||"";window.scrollTo({top:0,behavior:"smooth"})
}
function deleteDevice(id){
 let all=arr(KEY),d=all.find(x=>String(x.id)===String(id));if(!d)return;
 let used=arr(REQ).some(r=>String(r.deviceId)===String(id))||arr(WAR).some(w=>String(w.deviceId)===String(id))||arr(CON).some(c=>(c.deviceIds||[]).map(String).includes(String(id)))||arr(INV).some(i=>String(i.deviceId)===String(id));
 if(used){notice("لا يمكن حذف الجهاز لأنه مرتبط ببيانات تشغيلية. استخدم الأرشفة.",true);return}
 if(!confirm("حذف الجهاز نهائيًا؟"))return;save(KEY,all.filter(x=>String(x.id)!==String(id)));notice("تم حذف الجهاز");renderAll()
}
function archiveDevice(id){
 let all=arr(KEY),d=all.find(x=>String(x.id)===String(id));if(!d)return;d.status="مؤرشف";d.updatedAt=new Date().toISOString();save(KEY,all);let hs=arr(HIST);hs.unshift({id:"HIST-"+Date.now(),deviceId:id,event:"أرشفة الجهاز",date:new Date().toISOString()});save(HIST,hs);notice("تمت أرشفة الجهاز");renderAll()
}
function renderList(){
 let q=$("search").value.trim().toLowerCase(),fc=$("filterCustomer").value,ft=$("filterType").value,ds=arr(KEY).filter(d=>[d.id,d.customerName,d.brand,d.model,d.serialNumber,d.type].join(" ").toLowerCase().includes(q)&&(!fc||String(d.customerId)===String(fc))&&(!ft||d.type===ft));
 $("list").innerHTML=ds.length?ds.map(d=>'<div class="device"><h3>🔧 '+esc(d.id)+' — '+esc(d.customerName)+'</h3><span class="badge '+(d.status==="يعمل"?"ok":d.status==="يحتاج صيانة"?"warn":d.status==="مؤرشف"?"bad":"")+'">'+esc(d.status||"")+'</span><span class="badge">'+esc(d.type)+'</span><p>🏷️ '+esc(d.brand)+' '+esc(d.model)+'<br>🔢 السيريال: '+esc(d.serialNumber||"غير مسجل")+'<br>📍 '+esc(d.location||"غير محدد")+'<br>🛡️ الضمان: '+esc(d.warrantyId||"غير مرتبط")+'</p><div class="actions"><button class="blue" data-a="view" data-id="'+esc(d.id)+'">👁️ عرض السجل</button><button class="gray" data-a="edit" data-id="'+esc(d.id)+'">✏️ تعديل</button><button class="orange" data-a="archive" data-id="'+esc(d.id)+'">📦 أرشفة</button><button class="danger" data-a="delete" data-id="'+esc(d.id)+'">🗑️ حذف</button></div></div>').join(""):'<div class="empty">لا توجد أجهزة مطابقة.</div>'
}
function renderHistory(id){
 selectedDevice=id;let d=arr(KEY).find(x=>String(x.id)===String(id));if(!d){$("history").innerHTML='<div class="empty">الجهاز غير موجود.</div>';return}
 let req=arr(REQ).filter(r=>String(r.deviceId)===String(id)),war=arr(WAR).filter(w=>String(w.deviceId)===String(id)),inv=arr(INV).filter(i=>String(i.deviceId)===String(id)),hist=arr(HIST).filter(h=>String(h.deviceId)===String(id));
 let events=[...hist.map(x=>({date:x.date,event:x.event,details:x.details||""})),...req.map(x=>({date:x.createdAt||x.date,event:"طلب صيانة",details:(x.id||"")+" — "+(x.status||"")})),...war.map(x=>({date:x.startDate||x.createdAt,event:"ضمان",details:(x.id||"")+" — "+(x.status||"")})),...inv.map(x=>({date:x.date||x.createdAt,event:"فاتورة",details:(x.id||"")+" — "+(x.status||"")}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 $("history").innerHTML='<div class="info"><b>'+esc(d.id)+' — '+esc(d.customerName)+'</b><br>'+esc(d.type)+' / '+esc(d.brand)+' '+esc(d.model)+'<br>الحالة الفنية: '+esc(d.technicalStatus||"غير مسجلة")+'</div><div class="timeline">'+(events.length?events.map(e=>'<div class="event"><b>📌 '+esc(e.event)+'</b><small>'+esc(e.date||"")+'</small><div>'+esc(e.details)+'</div></div>').join(""):'<div class="empty">لا يوجد سجل بعد.</div>')+'</div>'
}
function renderAll(){
 let ds=arr(KEY),ws=arr(WAR),cs=arr(CON);$("total").textContent=ds.length;$("active").textContent=ds.filter(d=>["يعمل","يحتاج صيانة","متوقف"].includes(d.status)).length;$("maintenance").textContent=ds.filter(d=>d.status==="يحتاج صيانة").length;$("warranty").textContent=ds.filter(d=>ws.some(w=>String(w.deviceId)===String(d.id)&&!["منتهي","ملغي"].includes(w.status))).length;$("contracts").textContent=ds.filter(d=>cs.some(c=>(c.deviceIds||[]).map(String).includes(String(d.id))&&["نشط","مجدد"].includes(c.status))).length;renderList()
}
$("save").onclick=saveDevice;$("cancel").onclick=reset;$("search").oninput=renderList;$("filterCustomer").onchange=renderList;$("filterType").onchange=renderList;
$("list").onclick=e=>{let b=e.target.closest("button[data-a]");if(!b)return;let id=b.dataset.id;if(b.dataset.a==="view")renderHistory(id);else if(b.dataset.a==="edit")editDevice(id);else if(b.dataset.a==="archive")archiveDevice(id);else deleteDevice(id)};
loadTypes();loadCustomers("",true);reset();renderAll();
</script>
</body>
</html>
