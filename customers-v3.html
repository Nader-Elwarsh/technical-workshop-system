<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>العملاء - الورشة الفنية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#172033}
header{background:#07152f;color:#fff;padding:22px 16px}
.wrap{max-width:1100px;margin:auto;padding:16px}
header .wrap{padding:0;max-width:1100px}
h1{margin:0 0 7px}header p{margin:0;color:#dbe5ff}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
h2{margin:0 0 14px;color:#07152f}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin:5px 0}
input,textarea{width:100%;padding:12px;border:1px solid #ccd4de;border-radius:10px;font:inherit}
textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;cursor:pointer}
.primary{background:#16803c;color:#fff}.blue{background:#1769aa;color:#fff}.gray{background:#596273;color:#fff}.danger{background:#d60000;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;min-width:130px}
.notice{display:none;padding:11px;border-radius:10px;margin-bottom:12px}
.good{background:#e2f5e8;color:#146c2e}.bad{background:#ffe2e2;color:#a00000}
.search{display:grid;grid-template-columns:1fr auto;gap:8px}
.list{display:grid;gap:10px}
.customer{border:1px solid #e0e5eb;border-radius:13px;padding:14px}
.customer-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.customer h3{margin:0 0 7px;color:#07152f}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef1f5;margin:2px;font-size:12px}
.green{background:#e3f7e9;color:#146c2e}.orange{background:#fff0d6;color:#8b5b00}.red{background:#ffe2e2;color:#a00000}.bb{background:#e4f0ff;color:#1769aa}
.mini{font-size:13px;color:#667085;line-height:1.8}
.customer-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.customer-actions button{padding:8px 11px}
.relations{margin-top:12px;background:#f8fafc;border-radius:10px;padding:10px}
.rel-row{display:flex;justify-content:space-between;border-bottom:1px solid #e4e8ed;padding:8px 0}
.rel-row:last-child{border:0}
.hidden{display:none}
.empty{text-align:center;color:#777;padding:20px}
.back{display:block;text-align:center;background:#333;color:#fff;text-decoration:none;border-radius:10px;padding:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.search{grid-template-columns:1fr}.customer-head{display:block}}
</style>
</head>
<body>
<header><div class="wrap"><h1>👤 العملاء</h1><p>إدارة العملاء وربط كل عميل بأجهزته وطلبات الصيانة والزيارات والفواتير</p></div></header>

<div class="wrap">
<div id="notice" class="notice"></div>

<div class="card">
<h2>➕ تسجيل / تعديل عميل</h2>
<input type="hidden" id="customerId">
<div class="grid">
<div><label>اسم العميل *</label><input id="name" placeholder="الاسم بالكامل"></div>
<div><label>الاسم المختصر / الشهرة</label><input id="nickname"></div>
<div><label>رقم الهاتف *</label><input id="phone" inputmode="tel"></div>
<div><label>رقم إضافي</label><input id="phone2" inputmode="tel"></div>
<div><label>المركز</label><input id="center" placeholder="مطاي / بني مزار..."></div>
<div><label>القرية / المنطقة</label><input id="village"></div>
<div><label>الشارع / العنوان التفصيلي</label><input id="street"></div>
<div><label>مواعيد مناسبة للعميل</label><input id="workSchedule" placeholder="مثال: بعد 5 مساءً"></div>
<div class="full"><label>العنوان الكامل</label><textarea id="address" placeholder="يُفضّل كتابة وصف واضح للوصول"></textarea></div>
<div class="full"><label>ملاحظات</label><textarea id="notes"></textarea></div>
</div>
<div class="actions">
<button class="primary" id="saveBtn">💾 حفظ العميل</button>
<button class="gray" id="clearBtn">↩️ تفريغ النموذج</button>
</div>
</div>

<div class="card">
<h2>🔎 البحث في العملاء</h2>
<div class="search">
<input id="search" placeholder="ابحث بالاسم أو الهاتف أو العنوان أو رقم العميل">
<button class="blue" id="searchBtn">بحث</button>
</div>
</div>

<div class="card">
<h2>📋 العملاء المسجلون <span id="count" class="badge bb"></span></h2>
<div id="list" class="list"></div>
</div>

<a class="back" href="index.html">🏠 العودة إلى لوحة التحكم</a>
</div>

<script src="app-core.js"></script>
<script>
(function(){
"use strict";
const C=window.WorkshopCore;
const $=id=>document.getElementById(id);

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function show(msg,error=false){$("notice").textContent=msg;$("notice").className="notice "+(error?"bad":"good");$("notice").style.display="block";setTimeout(()=>{$("notice").style.display="none"},2800)}
function idOf(c){return C.idOf(c)}
function customers(){return C.list(C.KEYS.customers)}
function makeId(){return C.nextId("CUS-",C.KEYS.customers,5)}

function clearForm(){
 $("customerId").value="";$("name").value="";$("nickname").value="";$("phone").value="";$("phone2").value="";
 $("center").value="";$("village").value="";$("street").value="";$("workSchedule").value="";
 $("address").value="";$("notes").value="";$("saveBtn").textContent="💾 حفظ العميل";
 window.scrollTo({top:0,behavior:"smooth"});
}

function editCustomer(id){
 const c=C.findCustomer(id); if(!c)return;
 $("customerId").value=id;
 $("name").value=c.name||c.fullName||"";
 $("nickname").value=c.nickname||c.nickName||"";
 $("phone").value=c.phone||c.mobile||"";
 $("phone2").value=c.phone2||c.secondaryPhone||"";
 $("center").value=c.center||"";
 $("village").value=c.village||"";
 $("street").value=c.street||"";
 $("workSchedule").value=c.workSchedule||c.preferredTime||"";
 $("address").value=c.address||"";
 $("notes").value=c.notes||"";
 $("saveBtn").textContent="✏️ حفظ التعديل";
 window.scrollTo({top:0,behavior:"smooth"});
}

function saveCustomer(){
 const name=$("name").value.trim(),phone=$("phone").value.trim(),oldId=$("customerId").value.trim();
 if(!name||!phone){show("اكتب اسم العميل ورقم الهاتف أولًا.",true);return}
 const data={
   name,nickname:$("nickname").value.trim(),phone,phone2:$("phone2").value.trim(),
   center:$("center").value.trim(),village:$("village").value.trim(),street:$("street").value.trim(),
   workSchedule:$("workSchedule").value.trim(),address:$("address").value.trim(),notes:$("notes").value.trim(),
   updatedAt:C.now()
 };
 let arr=customers();
 if(oldId){
   const i=arr.findIndex(c=>String(idOf(c))===String(oldId));
   if(i<0){show("العميل غير موجود.",true);return}
   arr[i]=Object.assign({},arr[i],data,{id:oldId});
   C.write(C.KEYS.customers,arr);
   C.log("تعديل","العملاء",oldId,"تم تعديل بيانات العميل");
   show("تم تعديل بيانات العميل بنجاح.");
 }else{
   const id=makeId();
   arr.push(Object.assign({id,createdAt:C.now()},data));
   C.write(C.KEYS.customers,arr);
   C.getOrCreateLoyalty(id);
   C.log("إضافة","العملاء",id,"تم تسجيل عميل جديد");
   show("تم تسجيل العميل بنجاح.");
 }
 clearForm();render();
}

function deleteCustomer(id){
 const c=C.findCustomer(id);if(!c)return;
 const linked=C.customerRequests(id).length+C.customerDevices(id).length+C.customerVisits(id).length+C.customerInvoices(id).length;
 let msg="هل تريد حذف العميل "+(C.customerName(c)||id)+"؟";
 if(linked)msg+="\n\nتنبيه: هذا العميل مرتبط بـ "+linked+" سجل/سجلات تشغيلية. سيتم حذف سجل العميل فقط ولن نحذف الأجهزة أو الطلبات أو الفواتير المرتبطة به.";
 if(!confirm(msg))return;
 const arr=customers().filter(x=>String(idOf(x))!==String(id));
 C.write(C.KEYS.customers,arr);
 C.log("حذف","العملاء",id,"تم حذف سجل العميل");
 show("تم حذف سجل العميل.");
 render();
}

function view360(id){
 const data=C.customer360(id);if(!data)return;
 const c=data.customer;
 const requests=data.requests,devices=data.devices,visits=data.visits,invoices=data.invoices;
 let html=`
 <div class="customer" id="details-${esc(id)}">
 <div class="customer-head">
 <div><h3>📌 ${esc(C.customerName(c)||"العميل")}</h3><div class="mini">${esc(c.phone||c.mobile||"")} ${c.address?" — "+esc(c.address):""}</div></div>
 <span class="badge green">ملف العميل</span>
 </div>
 <div class="relations">
 <div class="rel-row"><span>📱 الأجهزة</span><b>${devices.length}</b></div>
 <div class="rel-row"><span>🔧 طلبات الصيانة</span><b>${requests.length}</b></div>
 <div class="rel-row"><span>📅 الزيارات</span><b>${visits.length}</b></div>
 <div class="rel-row"><span>🧾 الفواتير</span><b>${invoices.length}</b></div>
 <div class="rel-row"><span>💳 الرصيد المستحق</span><b>${Number(data.financial.balance||0).toFixed(2)} ${esc(C.settings().currency)}</b></div>
 <div class="rel-row"><span>⭐ نقاط الولاء</span><b>${Number(data.loyalty.points||0)}</b></div>
 </div>
 <div class="relations">
 <b>آخر طلبات الصيانة:</b>
 ${requests.slice(-5).reverse().map(r=>`<div class="mini">🔧 ${esc(C.idOf(r))} — ${esc(r.fault||r.description||"بدون وصف")} — ${esc(r.status||"جديد")}</div>`).join("")||'<div class="mini">لا توجد طلبات.</div>'}
 </div>
 </div>`;
 const temp=document.createElement("div");temp.innerHTML=html;
 const existing=document.getElementById("details-"+id);if(existing)existing.remove();

 const customerCard=document.querySelector('[data-customer-id="'+CSS.escape(id)+'"]');
 if(customerCard){
   customerCard.insertAdjacentElement("afterend",temp.firstElementChild);
   const details=document.getElementById("details-"+id);
   if(details)details.scrollIntoView({behavior:"smooth",block:"center"});
 }
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 let arr=customers();
 if(q)arr=arr.filter(c=>[idOf(c),C.customerName(c),c.phone,c.mobile,c.phone2,c.address,c.center,c.village,c.street].join(" ").toLowerCase().includes(q));
 $("count").textContent=arr.length+" عميل";
 if(!arr.length){$("list").innerHTML='<div class="empty">لا توجد عملاء مطابقة.</div>';return}
 $("list").innerHTML=arr.map(c=>{
   const id=idOf(c),rq=C.customerRequests(id),dv=C.customerDevices(id),vi=C.customerVisits(id),iv=C.customerInvoices(id);
   return `<div class="customer" data-customer-id="${esc(id)}">
    <div class="customer-head">
      <div><h3>${esc(C.customerName(c)||"عميل بدون اسم")}</h3>
      <div class="mini">🆔 ${esc(id)}<br>📞 ${esc(c.phone||c.mobile||"—")} ${c.phone2?" / "+esc(c.phone2):""}<br>📍 ${esc(c.address||[c.center,c.village,c.street].filter(Boolean).join(" - ")||"—")}</div></div>
      <div><span class="badge bb">طلبات ${rq.length}</span><span class="badge">أجهزة ${dv.length}</span></div>
    </div>
    <div class="customer-actions">
      <button class="blue" onclick="viewCustomer360('${esc(id)}')">👁️ ملف العميل</button>
      <button class="gray" onclick="editCustomer('${esc(id)}')">✏️ تعديل</button>
      <button class="danger" onclick="deleteCustomer('${esc(id)}')">🗑️ حذف</button>
    </div>
   </div>`;
 }).join("");
}
window.editCustomer=editCustomer;window.deleteCustomer=deleteCustomer;
window.viewCustomer360=view360;
$("saveBtn").onclick=saveCustomer;$("clearBtn").onclick=clearForm;$("searchBtn").onclick=render;
$("search").addEventListener("input",render);
try{C.syncRelations();render()}catch(e){show("حدث خطأ أثناء تحميل بيانات العملاء.",true);console.error(e)}
})();
</script>
</body>
</html>
