<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طلبات الصيانة - الورشة الفنية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #07152f;
            color: white;
            text-align: center;
            padding: 24px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 16px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #07152f;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 12px 0 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            font-family: inherit;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button,
        .btn {
            border: 0;
            border-radius: 9px;
            padding: 13px 18px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
        }

        .primary {
            background: #16803c;
            color: white;
            width: 100%;
            margin-top: 18px;
        }

        .secondary {
            background: #555;
            color: white;
            width: 100%;
            margin-top: 8px;
        }

        .danger {
            background: #c62828;
            color: white;
        }

        .edit {
            background: #1565c0;
            color: white;
        }

        .customer-info {
            display: none;
            background: #eef6ff;
            border: 1px solid #cfe2ff;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            line-height: 1.8;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .request {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            margin-top: 12px;
            background: #fafafa;
        }

        .request h3 {
            margin-top: 0;
            color: #07152f;
        }

        .request p {
            margin: 7px 0;
        }

        .request-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .request-actions button {
            flex: 1;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 14px;
        }

        .success {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 9px;
            margin-top: 12px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #07152f;
            color: white;
            padding: 14px;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        @media (max-width: 600px) {
            .request-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>طلبات الصيانة 🔧</h1>
    <p>الورشة الفنية لصيانة الأجهزة المنزلية والتكييف</p>
</header>

<div class="container">

    <a href="index.html" class="back">🏠 العودة إلى الرئيسية</a>

    <!-- تسجيل طلب -->
    <div class="card">

        <h2 id="formTitle">➕ تسجيل طلب صيانة</h2>

        <label>العميل</label>

        <select id="customerSelect" onchange="showCustomerInfo()">
            <option value="">جاري تحميل العملاء...</option>
        </select>

        <div id="customerInfo" class="customer-info"></div>

        <label>نوع الجهاز</label>

        <select id="deviceType">
            <option value="">اختر نوع الجهاز</option>
            <option>ثلاجة</option>
            <option>فريزر</option>
            <option>غسالة أوتوماتيك</option>
            <option>غسالة فوق أوتوماتيك</option>
            <option>غسالة نصف أوتوماتيك</option>
            <option>تكييف سبليت</option>
            <option>تكييف شباك</option>
            <option>سخان مياه</option>
            <option>سخان غاز</option>
            <option>كولدير</option>
            <option>أخرى</option>
        </select>

        <label>وصف العطل</label>

        <textarea id="fault" placeholder="اكتب وصف العطل بالتفصيل..."></textarea>

        <label>عنوان الزيارة</label>

        <input
            type="text"
            id="address"
            placeholder="سيتم تعبئته تلقائيًا من بيانات العميل"
        >

        <label>حالة الطلب</label>

        <select id="status">
            <option value="جديد">جديد</option>
            <option value="تم تحديد موعد">تم تحديد موعد</option>
            <option value="جاري التنفيذ">جاري التنفيذ</option>
            <option value="تم الإصلاح">تم الإصلاح</option>
            <option value="مؤجل">مؤجل</option>
            <option value="ملغي">ملغي</option>
        </select>

        <button class="primary" onclick="saveRequest()">
            💾 حفظ طلب الصيانة
        </button>

        <button
            class="secondary"
            id="cancelEdit"
            onclick="cancelEdit()"
            style="display:none;"
        >
            إلغاء التعديل
        </button>

        <div id="successMessage" class="success">
            تم حفظ طلب الصيانة بنجاح ✅
        </div>

    </div>

    <!-- الطلبات -->
    <div class="card">

        <h2>📋 الطلبات المسجلة</h2>

        <div id="requestsList">
            <div class="empty">
                لا توجد طلبات صيانة مسجلة حتى الآن
            </div>
        </div>

    </div>

</div>

<script>

    /*
     * مفتاح طلبات الصيانة
     */
    const REQUESTS_KEY = "technical_workshop_requests";

    let requests = [];
    let customers = [];
    let editingId = null;


    /*
     * تحميل العملاء
     *
     * نحاول اكتشاف قائمة العملاء تلقائيًا
     * حتى لا نحتاج لتعديل customers.html.
     */
    function loadCustomers() {

        customers = [];

        for (let i = 0; i < localStorage.length; i++) {

            const key = localStorage.key(i);

            try {

                const value = JSON.parse(localStorage.getItem(key));

                if (!Array.isArray(value) || value.length === 0) {
                    continue;
                }

                /*
                 * نبحث عن مصفوفة تحتوي على بيانات تشبه بيانات العملاء
                 */
                const looksLikeCustomers = value.some(item => {

                    if (!item || typeof item !== "object") {
                        return false;
                    }

                    return (
                        item.name ||
                        item.customerName ||
                        item.phone ||
                        item.mobile ||
                        item.phoneNumber
                    );
                });

                if (looksLikeCustomers) {

                    customers = value;

                    console.log("تم العثور على العملاء في:", key);

                    break;
                }

            } catch (error) {
                // تجاهل أي قيمة ليست JSON
            }
        }

        fillCustomerSelect();
    }


    /*
     * تجهيز قائمة العملاء
     */
    function fillCustomerSelect() {

        const select = document.getElementById("customerSelect");

        select.innerHTML = "";

        if (customers.length === 0) {

            select.innerHTML =
                '<option value="">لا يوجد عملاء مسجلون</option>';

            return;
        }

        const firstOption = document.createElement("option");

        firstOption.value = "";
        firstOption.textContent = "اختر العميل";

        select.appendChild(firstOption);


        customers.forEach((customer, index) => {

            const option = document.createElement("option");

            option.value = index;

            const name =
                customer.name ||
                customer.customerName ||
                customer.fullName ||
                "عميل بدون اسم";

            const phone =
                customer.phone ||
                customer.mobile ||
                customer.phoneNumber ||
                "";

            option.textContent =
                phone ? `${name} - ${phone}` : name;

            select.appendChild(option);
        });
    }


    /*
     * عرض بيانات العميل
     */
    function showCustomerInfo() {

        const select = document.getElementById("customerSelect");

        const info = document.getElementById("customerInfo");

        const address = document.getElementById("address");

        const index = select.value;

        if (index === "") {

            info.style.display = "none";

            address.value = "";

            return;
        }

        const customer = customers[index];

        if (!customer) {
            return;
        }

        const name =
            customer.name ||
            customer.customerName ||
            customer.fullName ||
            "غير محدد";

        const phone =
            customer.phone ||
            customer.mobile ||
            customer.phoneNumber ||
            "غير محدد";

        const customerAddress =
            customer.address ||
            customer.location ||
            customer.city ||
            customer.area ||
            "";

        info.innerHTML = `
            <strong>👤 الاسم:</strong> ${escapeHTML(name)}<br>
            <strong>📞 الهاتف:</strong> ${escapeHTML(phone)}<br>
            <strong>📍 العنوان:</strong> ${escapeHTML(customerAddress || "غير مسجل")}
        `;

        info.style.display = "block";

        address.value = customerAddress;
    }


    /*
     * حفظ طلب
     */
    function saveRequest() {

        const customerIndex =
            document.getElementById("customerSelect").value;

        const deviceType =
            document.getElementById("deviceType").value;

        const fault =
            document.getElementById("fault").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const status =
            document.getElementById("status").value;


        if (customerIndex === "") {

            alert("من فضلك اختر العميل");

            return;
        }

        if (deviceType === "") {

            alert("من فضلك اختر نوع الجهاز");

            return;
        }

        if (fault === "") {

            alert("من فضلك اكتب وصف العطل");

            return;
        }


        const customer = customers[customerIndex];

        const customerName =
            customer.name ||
            customer.customerName ||
            customer.fullName ||
            "غير محدد";

        const customerPhone =
            customer.phone ||
            customer.mobile ||
            customer.phoneNumber ||
            "";


        if (editingId !== null) {

            const request = requests.find(
                item => item.id === editingId
            );

            if (request) {

                request.customerIndex = customerIndex;
                request.customerName = customerName;
                request.customerPhone = customerPhone;
                request.deviceType = deviceType;
                request.fault = fault;
                request.address = address;
                request.status = status;
                request.updatedAt = new Date().toISOString();
            }

            editingId = null;

            document.getElementById("formTitle").textContent =
                "➕ تسجيل طلب صيانة";

            document.getElementById("cancelEdit").style.display =
                "none";

        } else {

            const request = {

                id: Date.now(),

                customerIndex: customerIndex,

                customerName: customerName,

                customerPhone: customerPhone,

                deviceType: deviceType,

                fault: fault,

                address: address,

                status: status,

                createdAt: new Date().toISOString()
            };

            requests.unshift(request);
        }


        localStorage.setItem(
            REQUESTS_KEY,
            JSON.stringify(requests)
        );


        showSuccess();

        clearForm();

        renderRequests();
    }


    /*
     * تحميل الطلبات
     */
    function loadRequests() {

        try {

            const saved =
                localStorage.getItem(REQUESTS_KEY);

            requests =
                saved ? JSON.parse(saved) : [];

        } catch (error) {

            requests = [];
        }

        renderRequests();
    }


    /*
     * عرض الطلبات
     */
    function renderRequests() {

        const container =
            document.getElementById("requestsList");

        if (requests.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    لا توجد طلبات صيانة مسجلة حتى الآن
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        requests.forEach(request => {

            const div =
                document.createElement("div");

            div.className = "request";


            div.innerHTML = `

                <h3>
                    🔧 ${escapeHTML(request.deviceType)}
                </h3>

                <p>
                    <strong>👤 العميل:</strong>
                    ${escapeHTML(request.customerName)}
                </p>

                <p>
                    <strong>📞 الهاتف:</strong>
                    ${escapeHTML(request.customerPhone || "غير مسجل")}
                </p>

                <p>
                    <strong>📍 العنوان:</strong>
                    ${escapeHTML(request.address || "غير مسجل")}
                </p>

                <p>
                    <strong>⚠️ العطل:</strong>
                    ${escapeHTML(request.fault)}
                </p>

                <p>
                    <strong>الحالة:</strong>
                    <span class="status">
                        ${escapeHTML(request.status)}
                    </span>
                </p>

                <div class="request-actions">

                    <button
                        class="edit"
                        onclick="editRequest(${request.id})"
                    >
                        ✏️ تعديل
                    </button>

                    <button
                        class="danger"
                        onclick="deleteRequest(${request.id})"
                    >
                        🗑️ حذف
                    </button>

                </div>
            `;


            container.appendChild(div);
        });
    }


    /*
     * تعديل طلب
     */
    function editRequest(id) {

        const request =
            requests.find(item => item.id === id);

        if (!request) {
            return;
        }

        editingId = id;

        document.getElementById("formTitle").textContent =
            "✏️ تعديل طلب الصيانة";

        document.getElementById("customerSelect").value =
            request.customerIndex;

        document.getElementById("deviceType").value =
            request.deviceType;

        document.getElementById("fault").value =
            request.fault;

        document.getElementById("address").value =
            request.address;

        document.getElementById("status").value =
            request.status;

        document.getElementById("cancelEdit").style.display =
            "block";

        showCustomerInfo();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /*
     * إلغاء التعديل
     */
    function cancelEdit() {

        editingId = null;

        document.getElementById("formTitle").textContent =
            "➕ تسجيل طلب صيانة";

        document.getElementById("cancelEdit").style.display =
            "none";

        clearForm();
    }


    /*
     * حذف طلب
     */
    function deleteRequest(id) {

        const request =
            requests.find(item => item.id === id);

        if (!request) {
            return;
        }

        const confirmed =
            confirm(
                `هل أنت متأكد من حذف طلب الصيانة الخاص بالعميل "${request.customerName}"؟`
            );

        if (!confirmed) {
            return;
        }

        requests =
            requests.filter(item => item.id !== id);

        localStorage.setItem(
            REQUESTS_KEY,
            JSON.stringify(requests)
        );

        renderRequests();
    }


    /*
     * تفريغ النموذج
     */
    function clearForm() {

        document.getElementById("customerSelect").value = "";

        document.getElementById("deviceType").value = "";

        document.getElementById("fault").value = "";

        document.getElementById("address").value = "";

        document.getElementById("status").value = "جديد";

        document.getElementById("customerInfo").style.display =
            "none";
    }


    /*
     * رسالة نجاح
     */
    function showSuccess() {

        const message =
            document.getElementById("successMessage");

        message.style.display = "block";

        setTimeout(() => {

            message.style.display = "none";

        }, 2500);
    }


    /*
     * حماية عرض النصوص
     */
    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /*
     * تشغيل الصفحة
     */
    loadCustomers();

    loadRequests();

</script>

</body>

</html>
