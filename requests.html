<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152f">
<title>أوامر الشغل - الورشة الفنية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#172033}
header{background:#07152f;color:#fff;padding:22px 15px;text-align:center}
header h1{margin:0 0 7px;font-size:28px} header p{margin:0;color:#dbe5ff}
.container{max-width:1050px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
h2{margin:0 0 15px;color:#07152f}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin:10px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1px solid #cfd6df;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:95px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 16px;color:#fff;font-size:16px;cursor:pointer}
.primary{background:#16803c}.gray{background:#596273}.blue{background:#1769aa}.danger{background:#d60000}.dark{background:#07152f}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
.info{display:none;background:#eef6ff;border:1px solid #cfe2ff;border-radius:11px;padding:12px;margin-top:10px;line-height:1.8}
.search{margin-bottom:14px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.request{border:1px solid #dfe4ea;border-radius:14px;padding:16px;margin-top:12px}
.request h3{margin:0 0 8px;color:#07152f}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e8edf3;margin:3px;font-size:13px}
.badge.priority{background:#fff0d6;color:#9a5a00}.badge.done{background:#e5f7eb;color:#146c2e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:#777;padding:28px}
.notice{padding:12px;border-radius:10px;margin-bottom:12px;display:none}
.ok{background:#e1f5e7;color:#146c2e}.err{background:#ffe2e2;color:#a00000}
.visit{background:#f8fafc;border-radius:10px;padding:10px;margin-top:8px}
.back{display:block;text-align:center;text-decoration:none;background:#333;color:#fff;padding:14px;border-radius:10px}
.hidden{display:none!important}
@media(max-width:700px){.grid,.filters,.two{grid-template-columns:1fr}.full{grid-column:auto}.actions{flex-direction:column}}
</style>
</head>
<body>
<header>
<h1>🔧 أوامر الشغل وطلبات الصيانة</h1>
<p>الورشة الفنية لصيانة الأجهزة المنزلية والتكييف</p>
</header>

<div class="container">
<div id="notice" class="notice"></div>

<div class="card">
<h2 id="formTitle">➕ تسجيل أمر شغل جديد</h2>

<div class="grid">
<div>
<label>العميل *</label>
<select id="customer"><option value="">جارٍ تحميل العملاء...</option></select>
<div id="customerInfo" class="info"></div>
</div>

<div>
<label>الجهاز *</label>
<select id="device"><option value="">اختر الجهاز بعد اختيار العميل</option></select>
<div id="deviceInfo" class="info"></div>
</div>

<div>
<label>نوع أمر الشغل *</label>
<select id="workType">
<option value="">اختر النوع</option>
<option>صيانة منزلية</option><option>صيانة داخل الورشة</option>
<option>تركيب جهاز</option><option>فك ونقل جهاز</option>
<option>زيارة فحص فقط</option><option>زيارة ضمان</option>
<option>زيارة دورية</option><option>معاينة قبل الإصلاح</option>
</select>
</div>

<div>
<label>مصدر الطلب *</label>
<select id="source">
<option>بلاغ هاتفي</option><option>زيارة للمركز</option>
<option>الموقع الإلكتروني</option><option>تطبيق العميل</option>
<option>زيارة دورية من عقد</option><option>مطالبة ضمان</option>
<option>أمر متابعة بعد زيارة سابقة</option>
</select>
</div>

<div>
<label>الأولوية</label>
<select id="priority">
<option>عاجلة جدًا</option><option>عاجلة</option><option selected>عادية</option><option>منخفضة</option>
</select>
</div>

<div>
<label>حالة أمر الشغل</label>
<select id="status">
<option>جديد</option><option>بانتظار الإسناد</option><option>تم الإسناد</option>
<option>في الطريق</option><option>جاري الفحص</option><option>بانتظار موافقة العميل</option>
<option>بانتظار قطعة غيار</option><option>جاري الإصلاح</option>
<option>مكتمل</option><option>مغلق</option><option>ملغي</option><option>مؤرشف</option>
</select>
</div>

<div>
<label>الفني المسؤول</label>
<input id="technician" placeholder="اسم الفني أو رقم الفني">
</div>

<div>
<label>الموعد المحدد</label>
<input id="visitDate" type="datetime-local">
</div>

<div class="full">
<label>عنوان الزيارة</label>
<input id="address" placeholder="يُملأ تلقائيًا من بيانات العميل">
</div>

<div class="full">
<label>وصف العطل / المشكلة *</label>
<textarea id="problem" placeholder="اكتب وصف العطل بالتفصيل..."></textarea>
</div>

<div>
<label>سبب العطل / التشخيص</label>
<textarea id="diagnosis" placeholder="يُستكمل بعد الفحص"></textarea>
</div>

<div>
<label>الإجراءات التي تم تنفيذها</label>
<textarea id="actionsDone" placeholder="ما الذي تم عمله؟"></textarea>
</div>

<div>
<label>القطع المطلوبة</label>
<textarea id="parts" placeholder="اكتب القطع المطلوبة أو المستخدمة"></textarea>
</div>

<div>
<label>التكلفة التقديرية</label>
<input id="estimatedCost" type="number" min="0" step="0.01" placeholder="0">
</div>

<div>
<label>موافقة العميل</label>
<select id="approval">
<option value="غير مطلوبة">غير مطلوبة</option>
<option value="مطلوبة">مطلوبة</option>
<option value="تمت الموافقة">تمت الموافقة</option>
<option value="تم الرفض">تم الرفض</option>
<option value="تأجيل">تأجيل</option>
</select>
</div>

<div class="full">
<label>ملاحظات إضافية</label>
<textarea id="notes" placeholder="أي ملاحظات تشغيلية أو إدارية..."></textarea>
</div>
</div>

<div class="actions">
<button class="btn primary" id="saveBtn">💾 حفظ أمر الشغل</button>
<button class="btn gray hidden" id="cancelBtn">إلغاء التعديل</button>
</div>
</div>

<div class="card">
<h2>📋 سجل أوامر الشغل</h2>
<div class="filters">
<input id="search" placeholder="🔎 ابحث برقم الأمر أو العميل أو الهاتف أو الجهاز...">
<select id="statusFilter"><option value="">كل الحالات</option></select>
<select id="priorityFilter"><option value="">كل الأولويات</option><option>عاجلة جدًا</option><option>عاجلة</option><option>عادية</option><option>منخفضة</option></select>
</div>
<div id="requestsList"></div>
</div>

<a class="back" href="index.html">🏠 العودة إلى الرئيسية</a>
</div>

<script>
const CUSTOMERS_KEY="customers";
const REQUESTS_KEY="maintenanceRequests";
const DEVICES_KEY="devices";
let editingId=null;

const statuses=["جديد","بانتظار الإسناد","تم الإسناد","في الطريق","جاري الفحص","بانتظار موافقة العميل","بانتظار قطعة غيار","جاري الإصلاح","مكتمل","مغلق","ملغي","مؤرشف"];

function arr(key){try{const x=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function customers(){return arr(CUSTOMERS_KEY)}
function requests(){return arr(REQUESTS_KEY)}
function devices(){return arr(DEVICES_KEY)}
function saveRequests(x){localStorage.setItem(REQUESTS_KEY,JSON.stringify(x))}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function idNext(){
 let max=0;
 requests().forEach(r=>{let m=String(r.id||"").match(/^WO-(\d+)$/);if(m)max=Math.max(max,+m[1])});
 return "WO-"+String(max+1).padStart(5,"0");
}
function msg(t,err=false){
 const n=document.getElementById("notice");n.textContent=t;n.className="notice "+(err?"err":"ok");n.style.display="block";
 setTimeout(()=>n.style.display="none",3000)
}
function customerAddress(c){
 if(!c)return"";
 const a=(c.addresses||[]).find(x=>x&&x.isDefault)||(c.addresses||[])[0];
 if(a)return[a.governorate,a.center,a.city,a.street].filter(Boolean).join(" - ");
 return[c.governorate,c.center,c.city,c.address].filter(Boolean).join(" - ");
}
function loadCustomers(selected=""){
 const s=document.getElementById("customer"), cs=customers();
 s.innerHTML='<option value="">اختر العميل</option>';
 cs.filter(c=>c.status!=="archived").forEach(c=>{
  const o=document.createElement("option");o.value=c.id;o.textContent=(c.name||"بدون اسم")+" — "+(c.phone||"بدون هاتف")+" — "+c.id;s.appendChild(o)
 });
 if(selected)s.value=String(selected);
 showCustomer();
}
function showCustomer(){
 const c=customers().find(x=>String(x.id)===String(document.getElementById("customer").value));
 const box=document.getElementById("customerInfo");
 if(!c){box.style.display="none";loadDevices("");return}
 box.innerHTML="👤 <b>"+esc(c.name)+"</b><br>🆔 "+esc(c.id)+"<br>📞 "+esc(c.phone||"غير مسجل")+"<br>📍 "+esc(customerAddress(c)||"غير مسجل");
 box.style.display="block";
 if(!editingId)document.getElementById("address").value=customerAddress(c);
 loadDevices("");
}
function loadDevices(selected=""){
 const cid=document.getElementById("customer").value,s=document.getElementById("device");
 const ds=devices().filter(d=>String(d.customerId)===String(cid));
 s.innerHTML='<option value="">'+(cid?(ds.length?"اختر جهاز العميل":"لا توجد أجهزة مسجلة لهذا العميل"):"اختر الجهاز بعد اختيار العميل")+'</option>';
 ds.forEach(d=>{const o=document.createElement("option");o.value=d.id;o.textContent=(d.brand||"جهاز")+" — "+(d.type||"")+(d.model?" — "+d.model:"")+" — "+d.id;s.appendChild(o)});
 if(selected)s.value=String(selected);
 showDevice()
}
function showDevice(){
 const d=devices().find(x=>String(x.id)===String(document.getElementById("device").value)),b=document.getElementById("deviceInfo");
 if(!d){b.style.display="none";return}
 b.innerHTML="📱 <b>"+esc(d.brand||"جهاز")+"</b> — "+esc(d.type||"غير محدد")+"<br>🆔 "+esc(d.id)+"<br>🔢 الموديل: "+esc(d.model||"غير مسجل")+"<br>🏷️ Serial: "+esc(d.serial||"غير مسجل");
 b.style.display="block";
}
function resetForm(){
 editingId=null;
 document.getElementById("formTitle").textContent="➕ تسجيل أمر شغل جديد";
 document.getElementById("saveBtn").textContent="💾 حفظ أمر الشغل";
 document.getElementById("cancelBtn").classList.add("hidden");
 ["customer","device","workType","technician","visitDate","address","problem","diagnosis","actionsDone","parts","estimatedCost","notes"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("source").value="بلاغ هاتفي";
 document.getElementById("priority").value="عادية";
 document.getElementById("status").value="جديد";
 document.getElementById("approval").value="غير مطلوبة";
 document.getElementById("customerInfo").style.display="none";
 document.getElementById("deviceInfo").style.display="none";
 loadCustomers();
}
function save(){
 const cid=document.getElementById("customer").value,c=customers().find(x=>String(x.id)===String(cid));
 const workType=document.getElementById("workType").value,problem=document.getElementById("problem").value.trim();
 if(!c){msg("اختر العميل أولًا",true);return}
 if(!workType){msg("اختر نوع أمر الشغل",true);return}
 if(!problem){msg("اكتب وصف العطل أو المشكلة",true);return}
 const rs=requests(),old=editingId?rs.find(r=>String(r.id)===String(editingId)):null;
 const d=devices().find(x=>String(x.id)===String(document.getElementById("device").value));
 const now=new Date().toISOString();
 const r={
  id:editingId||idNext(),customerId:String(c.id),customerName:c.name||"",customerPhone:c.phone||"",
  customerAddress:customerAddress(c),deviceId:d?String(d.id):"",deviceName:d?((d.brand||"")+" "+(d.type||"")):"",
  workType,source:document.getElementById("source").value,priority:document.getElementById("priority").value,
  status:document.getElementById("status").value,technician:document.getElementById("technician").value.trim(),
  visitDate:document.getElementById("visitDate").value,address:document.getElementById("address").value.trim(),
  problem,diagnosis:document.getElementById("diagnosis").value.trim(),actionsDone:document.getElementById("actionsDone").value.trim(),
  parts:document.getElementById("parts").value.trim(),estimatedCost:Number(document.getElementById("estimatedCost").value||0),
  approval:document.getElementById("approval").value,notes:document.getElementById("notes").value.trim(),
  visits:old?.visits||[],partsReserved:old?.partsReserved||[],createdAt:old?.createdAt||now,updatedAt:now,
  audit:[...(old?.audit||[]),{at:now,event:editingId?"تعديل أمر الشغل":"إنشاء أمر الشغل",status:document.getElementById("status").value}]
 };
 const i=rs.findIndex(x=>String(x.id)===String(r.id));if(i>=0)rs[i]=r;else rs.unshift(r);saveRequests(rs);
 updateCustomerStats(c.id);
 msg(editingId?"تم تعديل أمر الشغل بنجاح ✅":"تم تسجيل أمر الشغل بنجاح ✅");resetForm();render()
}
function updateCustomerStats(cid){
 const cs=customers(),c=cs.find(x=>String(x.id)===String(cid));if(!c)return;
 const rs=requests().filter(r=>String(r.customerId)===String(cid));
 c.stats=c.stats||{};c.stats.workOrders=rs.length;c.stats.visits=rs.reduce((n,r)=>n+(r.visits?.length||0),0);c.updatedAt=new Date().toISOString();
 localStorage.setItem(CUSTOMERS_KEY,JSON.stringify(cs))
}
function edit(id){
 const r=requests().find(x=>String(x.id)===String(id));if(!r)return;
 editingId=r.id;document.getElementById("formTitle").textContent="✏️ تعديل أمر الشغل";document.getElementById("saveBtn").textContent="💾 حفظ التعديل";document.getElementById("cancelBtn").classList.remove("hidden");
 loadCustomers(r.customerId);
 document.getElementById("workType").value=r.workType||"";document.getElementById("source").value=r.source||"بلاغ هاتفي";document.getElementById("priority").value=r.priority||"عادية";document.getElementById("status").value=r.status||"جديد";document.getElementById("technician").value=r.technician||"";document.getElementById("visitDate").value=r.visitDate||"";document.getElementById("address").value=r.address||"";document.getElementById("problem").value=r.problem||"";document.getElementById("diagnosis").value=r.diagnosis||"";document.getElementById("actionsDone").value=r.actionsDone||"";document.getElementById("parts").value=r.parts||"";document.getElementById("estimatedCost").value=r.estimatedCost||"";document.getElementById("approval").value=r.approval||"غير مطلوبة";document.getElementById("notes").value=r.notes||"";
 loadDevices(r.deviceId);window.scrollTo({top:0,behavior:"smooth"})
}
function remove(id){
 const rs=requests(),r=rs.find(x=>String(x.id)===String(id));if(!r)return;
 if(!confirm("حذف أمر الشغل "+r.id+"؟"))return;
 saveRequests(rs.filter(x=>String(x.id)!==String(id)));updateCustomerStats(r.customerId);render();msg("تم حذف أمر الشغل")
}
function date(v){if(!v)return"غير محدد";const d=new Date(v);return isNaN(d)?v:d.toLocaleString("ar-EG")}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase(),sf=document.getElementById("statusFilter").value,pf=document.getElementById("priorityFilter").value;
 const all=requests(),list=all.filter(r=>[r.id,r.customerId,r.customerName,r.customerPhone,r.deviceName,r.workType,r.problem,r.technician,r.address,r.status].join(" ").toLowerCase().includes(q)&&(!sf||r.status===sf)&&(!pf||r.priority===pf));
 const box=document.getElementById("requestsList");
 if(!list.length){box.innerHTML='<div class="empty">'+(all.length?"لا توجد نتائج مطابقة 🔎":"لا توجد أوامر شغل حتى الآن 🔧")+"</div>";return}
 box.innerHTML="";
 list.forEach(r=>{
  const el=document.createElement("div");el.className="request";
  const done=["مكتمل","مغلق"].includes(r.status);
  el.innerHTML="<h3>🔧 "+esc(r.id)+" — "+esc(r.customerName)+"</h3>"+
   '<span class="badge">👤 '+esc(r.customerId)+'</span>'+
   '<span class="badge">📱 '+esc(r.deviceName||r.deviceId||"بدون جهاز محدد")+'</span>'+
   '<span class="badge '+(r.priority==="عاجلة جدًا"||r.priority==="عاجلة"?"priority":"")+'">⚡ '+esc(r.priority)+'</span>'+
   '<span class="badge '+(done?"done":"")+'">📌 '+esc(r.status)+'</span>'+
   "<p><b>🛠️ النوع:</b> "+esc(r.workType)+" — <b>📥 المصدر:</b> "+esc(r.source)+"</p>"+
   "<p><b>📞 الهاتف:</b> "+esc(r.customerPhone||"غير مسجل")+"<br><b>📍 العنوان:</b> "+esc(r.address||r.customerAddress||"غير محدد")+"</p>"+
   "<p><b>⚠️ المشكلة:</b> "+esc(r.problem)+"</p>"+
   (r.technician?"<p><b>👨‍🔧 الفني:</b> "+esc(r.technician)+"</p>":"")+
   "<p><b>📅 الموعد:</b> "+esc(date(r.visitDate))+"</p>"+
   (r.diagnosis?"<p><b>🔍 التشخيص:</b> "+esc(r.diagnosis)+"</p>":"")+
   (r.actionsDone?"<p><b>🔨 الإجراءات:</b> "+esc(r.actionsDone)+"</p>":"")+
   (r.parts?"<p><b>🔩 القطع:</b> "+esc(r.parts)+"</p>":"")+
   (r.estimatedCost?"<p><b>💰 تقديري:</b> "+esc(r.estimatedCost)+" جنيه</p>":"")+
   "<p><b>🤝 موافقة العميل:</b> "+esc(r.approval||"غير محددة")+"</p>"+
   (r.notes?"<p>📝 "+esc(r.notes)+"</p>":"")+
   (r.visits?.length?'<div class="visit">📍 عدد الزيارات المسجلة: '+r.visits.length+"</div>":"")+
   '<div class="actions"><button class="btn blue" data-a="edit" data-id="'+esc(r.id)+'">✏️ تعديل</button><button class="btn danger" data-a="delete" data-id="'+esc(r.id)+'">🗑️ حذف</button></div>";
  box.appendChild(el)
 })
}
function initFilters(){const s=document.getElementById("statusFilter");statuses.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;s.appendChild(o)})}
document.getElementById("customer").onchange=showCustomer;
document.getElementById("device").onchange=showDevice;
document.getElementById("saveBtn").onclick=save;
document.getElementById("cancelBtn").onclick=resetForm;
document.getElementById("search").oninput=render;
document.getElementById("statusFilter").onchange=render;
document.getElementById("priorityFilter").onchange=render;
document.getElementById("requestsList").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;b.dataset.a==="edit"?edit(b.dataset.id):remove(b.dataset.id)};
initFilters();loadCustomers();render();
</script>
</body>
</html>
