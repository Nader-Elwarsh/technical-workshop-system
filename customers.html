<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العملاء - الورشة الفنية</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#07152f;
    color:#fff;
    text-align:center;
    padding:24px 15px;
}

header h1{
    margin:0 0 8px;
    font-size:28px;
}

header p{
    margin:0;
    font-size:15px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:16px;
}

.search-box{
    background:#fff;
    padding:14px;
    border-radius:14px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.search-row{
    display:flex;
    gap:8px;
}

.search-row input{
    flex:1;
    min-width:0;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    font-family:inherit;
    outline:none;
}

.search-row input:focus{
    border-color:#07152f;
}

.search-btn{
    border:0;
    border-radius:10px;
    padding:0 18px;
    background:#07152f;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.add-button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#16803c;
    color:#fff;
    font-size:17px;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:15px;
}

.add-box{
    background:#fff;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
    display:none;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.add-box h2{
    margin:0 0 18px;
    color:#07152f;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    font-family:inherit;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.save-button{
    width:100%;
    padding:14px;
    background:#16803c;
    color:#fff;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-family:inherit;
    cursor:pointer;
}

.customers-title{
    background:#07152f;
    color:#fff;
    text-align:center;
    padding:20px;
    border-radius:14px;
    margin-bottom:15px;
}

.customers-title h2{
    margin:0 0 9px;
}

.customer{
    background:#fff;
    padding:18px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
}

.customer-name{
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}

.customer-id{
    color:#555;
    font-size:14px;
    margin-bottom:10px;
}

.customer p{
    margin:8px 0;
    line-height:1.6;
}

.delete-button{
    width:100%;
    padding:13px;
    margin-top:12px;
    background:#d60000;
    color:#fff;
    border:0;
    border-radius:9px;
    font-size:16px;
    font-family:inherit;
    cursor:pointer;
}

.empty{
    background:#fff;
    padding:25px;
    border-radius:12px;
    text-align:center;
    color:#777;
}

.message{
    display:none;
    padding:13px;
    border-radius:9px;
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
}

.success{
    background:#d8f3df;
    color:#146c2e;
}

.error{
    background:#ffdede;
    color:#a00000;
}

.back-button{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#333;
    color:#fff;
    padding:14px;
    border-radius:10px;
    margin-top:25px;
}

@media(max-width:600px){
    header h1{font-size:24px}
    .container{padding:12px}
    .search-row{flex-direction:column}
    .search-btn{padding:13px}
}
</style>
</head>

<body>

<header>
    <h1>👥 إدارة العملاء</h1>
    <p>الورشة الفنية لصيانة الأجهزة المنزلية والتكييف</p>
</header>

<div class="container">

    <div id="message" class="message"></div>

    <div class="search-box">
        <div class="search-row">
            <input id="searchInput" type="search"
                   placeholder="🔎 اكتب اسم العميل أو الهاتف أو رقم العميل">
            <button class="search-btn" onclick="searchCustomers()">بحث 🔎</button>
        </div>
    </div>

    <button class="add-button" onclick="toggleAddForm()">
        ➕ إضافة عميل جديد
    </button>

    <div id="addBox" class="add-box">
        <h2>➕ تسجيل عميل جديد</h2>

        <div class="form-group">
            <label>اسم العميل</label>
            <input id="customerName" type="text" placeholder="اكتب اسم العميل">
        </div>

        <div class="form-group">
            <label>رقم الهاتف</label>
            <input id="customerPhone" type="tel" placeholder="مثال: 01005005000">
        </div>

        <div class="form-group">
            <label>العنوان</label>
            <input id="customerAddress" type="text" placeholder="مثال: مطاي - المنيا">
        </div>

        <div class="form-group">
            <label>ملاحظات</label>
            <textarea id="customerNotes" placeholder="ملاحظات عن العميل..."></textarea>
        </div>

        <button class="save-button" onclick="addCustomer()">💾 حفظ العميل</button>
    </div>

    <div class="customers-title">
        <h2>📋 العملاء المسجلون</h2>
        <div>عدد العملاء: <strong id="customerCount">0</strong></div>
    </div>

    <div id="customersList"></div>

    <a href="index.html" class="back-button">🏠 العودة إلى الرئيسية</a>
</div>

<script>
const CUSTOMERS_KEY = "customers";
const COUNTER_KEY = "customerCounter";

function getCustomers(){
    const data = localStorage.getItem(CUSTOMERS_KEY);
    if(!data) return [];
    try{
        const result = JSON.parse(data);
        return Array.isArray(result) ? result : [];
    }catch(e){
        return [];
    }
}

function saveCustomers(customers){
    localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(customers));
}

function getNextCustomerId(){
    let counter = parseInt(localStorage.getItem(COUNTER_KEY) || "0",10);
    counter++;
    localStorage.setItem(COUNTER_KEY, counter);
    return "CUS-" + String(counter).padStart(4,"0");
}

function toggleAddForm(){
    const box = document.getElementById("addBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
}

function addCustomer(){
    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("customerPhone").value.trim();
    const address = document.getElementById("customerAddress").value.trim();
    const notes = document.getElementById("customerNotes").value.trim();

    if(!name){
        showMessage("اكتب اسم العميل أولاً","error");
        return;
    }

    if(!phone){
        showMessage("اكتب رقم الهاتف أولاً","error");
        return;
    }

    const customers = getCustomers();

    customers.push({
        id:getNextCustomerId(),
        name:name,
        phone:phone,
        address:address,
        notes:notes,
        createdAt:new Date().toISOString()
    });

    saveCustomers(customers);

    document.getElementById("customerName").value="";
    document.getElementById("customerPhone").value="";
    document.getElementById("customerAddress").value="";
    document.getElementById("customerNotes").value="";
    document.getElementById("addBox").style.display="none";

    displayCustomers();
    showMessage("تم حفظ العميل بنجاح ✅","success");
}

function searchCustomers(){
    displayCustomers();
}

function displayCustomers(){
    const customers = getCustomers();
    const list = document.getElementById("customersList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();

    const filtered = customers.filter(customer =>
        String(customer.name || "").toLowerCase().includes(search) ||
        String(customer.phone || "").toLowerCase().includes(search) ||
        String(customer.id || "").toLowerCase().includes(search) ||
        String(customer.address || "").toLowerCase().includes(search)
    );

    document.getElementById("customerCount").textContent = customers.length;

    if(filtered.length === 0){
        list.innerHTML =
            '<div class="empty">' +
            (customers.length === 0
                ? "لا يوجد عملاء مسجلون حتى الآن 📋"
                : "لا توجد نتائج مطابقة 🔎") +
            '</div>';
        return;
    }

    list.innerHTML = "";

    filtered.slice().reverse().forEach(customer => {
        const card = document.createElement("div");
        card.className = "customer";

        card.innerHTML =
            '<div class="customer-name">👤 ' + escapeHTML(customer.name) + '</div>' +
            '<div class="customer-id">🆔 رقم العميل: <strong>' + escapeHTML(customer.id) + '</strong></div>' +
            '<p>📞 ' + escapeHTML(customer.phone) + '</p>' +
            '<p>📍 ' + escapeHTML(customer.address || "غير مسجل") + '</p>' +
            (customer.notes ? '<p>📝 ' + escapeHTML(customer.notes) + '</p>' : '') +
            '<button class="delete-button" data-customer-id="' + escapeHTML(customer.id) + '">🗑️ حذف العميل</button>';

        list.appendChild(card);
    });
}

function deleteCustomer(id){
    const customers = getCustomers();
    const customer = customers.find(item => item.id === id);

    if(!customer) return;

    if(!confirm("هل أنت متأكد من حذف العميل؟\n\n" + customer.name)) return;

    saveCustomers(customers.filter(item => item.id !== id));
    displayCustomers();
    showMessage("تم حذف العميل 🗑️","success");
}

function showMessage(text,type){
    const message = document.getElementById("message");
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";

    setTimeout(function(){
        message.style.display = "none";
    },2500);
}

function escapeHTML(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

document.getElementById("customersList").addEventListener("click", function(e){
    const button = e.target.closest(".delete-button");
    if(!button) return;

    const id = button.getAttribute("data-customer-id");
    deleteCustomer(id);
});

document.getElementById("searchInput").addEventListener("keydown",function(e){
    if(e.key === "Enter") searchCustomers();
});

displayCustomers();
</script>

</body>
</html>
