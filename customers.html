<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة العملاء - الورشة الفنية</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

/* ================= HEADER ================= */

header {
    background: #07152f;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0 0 10px;
    font-size: 28px;
}

header p {
    margin: 0;
    font-size: 15px;
}

/* ================= CONTAINER ================= */

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* ================= SEARCH ================= */

.search-box {
    background: white;
    padding: 15px;
    border-radius: 14px;
    margin-bottom: 18px;
}

.search-box input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
}

/* ================= BUTTON ================= */

.add-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #07152f;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-bottom: 15px;
}

/* ================= ADD FORM ================= */

.add-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
    display: none;
}

.add-box h2 {
    margin-top: 0;
    color: #07152f;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    font-family: inherit;
}

.form-group textarea {
    min-height: 80px;
    resize: vertical;
}

.save-button {
    width: 100%;
    padding: 14px;
    background: #16803c;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 17px;
}

/* ================= TITLE ================= */

.customers-title {
    background: #07152f;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
}

.customers-title h2 {
    margin: 0 0 10px;
}

/* ================= CUSTOMER CARD ================= */

.customer {
    background: white;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
}

.customer-name {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 10px;
}

.customer-id {
    color: #555;
    font-size: 14px;
    margin-bottom: 10px;
}

.customer p {
    margin: 8px 0;
    line-height: 1.6;
}

.delete-button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    background: #d60000;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
}

/* ================= EMPTY ================= */

.empty {
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    color: #777;
}

/* ================= MESSAGE ================= */

.message {
    display: none;
    padding: 13px;
    border-radius: 9px;
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

.success {
    background: #d8f3df;
    color: #146c2e;
}

.error {
    background: #ffdede;
    color: #a00000;
}

/* ================= BACK ================= */

.back-button {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #333;
    color: white;
    padding: 14px;
    border-radius: 10px;
    margin-top: 25px;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 12px;
    }

}

</style>

</head>


<body>


<header>

    <h1>👥 إدارة العملاء</h1>

    <p>
        الورشة الفنية لصيانة الأجهزة المنزلية والتكييف
    </p>

</header>


<div class="container">


    <!-- رسالة النظام -->

    <div id="message" class="message"></div>


    <!-- البحث -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 ابحث بالاسم أو الهاتف أو رقم العميل..."
            oninput="displayCustomers()"
        >

    </div>


    <!-- زر إضافة -->

    <button
        class="add-button"
        onclick="toggleAddForm()"
    >
        ➕ إضافة عميل جديد
    </button>


    <!-- نموذج إضافة العميل -->

    <div
        id="addBox"
        class="add-box"
    >

        <h2>➕ تسجيل عميل جديد</h2>


        <div class="form-group">

            <label>
                اسم العميل
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="اكتب اسم العميل"
            >

        </div>


        <div class="form-group">

            <label>
                رقم الهاتف
            </label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="مثال: 01005005000"
            >

        </div>


        <div class="form-group">

            <label>
                العنوان
            </label>

            <input
                type="text"
                id="customerAddress"
                placeholder="مثال: مطاي - المنيا"
            >

        </div>


        <div class="form-group">

            <label>
                ملاحظات
            </label>

            <textarea
                id="customerNotes"
                placeholder="ملاحظات عن العميل..."
            ></textarea>

        </div>


        <button
            class="save-button"
            onclick="addCustomer()"
        >
            💾 حفظ العميل
        </button>

    </div>


    <!-- عنوان العملاء -->

    <div class="customers-title">

        <h2>
            📋 العملاء المسجلون
        </h2>

        <div>

            عدد العملاء:
            <strong id="customerCount">0</strong>

        </div>

    </div>


    <!-- قائمة العملاء -->

    <div id="customersList"></div>


    <!-- العودة -->

    <a
        href="index.html"
        class="back-button"
    >
        🏠 العودة إلى الرئيسية
    </a>


</div>


<script>

/* ==================================================
   إعدادات التخزين
================================================== */

const CUSTOMERS_KEY = "customers";

const COUNTER_KEY = "customerCounter";


/* ==================================================
   قراءة العملاء
================================================== */

function getCustomers() {

    const data =
        localStorage.getItem(CUSTOMERS_KEY);

    if (!data) {

        return [];

    }

    try {

        const customers =
            JSON.parse(data);

        return Array.isArray(customers)
            ? customers
            : [];

    } catch {

        return [];

    }

}


/* ==================================================
   حفظ العملاء
================================================== */

function saveCustomers(customers) {

    localStorage.setItem(
        CUSTOMERS_KEY,
        JSON.stringify(customers)
    );

}


/* ==================================================
   رقم العميل
================================================== */

function getNextCustomerId() {

    let counter =
        parseInt(
            localStorage.getItem(COUNTER_KEY)
        ) || 0;


    counter++;


    localStorage.setItem(
        COUNTER_KEY,
        counter
    );


    return "CUS-" +
        String(counter).padStart(4, "0");

}


/* ==================================================
   إظهار / إخفاء نموذج الإضافة
================================================== */

function toggleAddForm() {

    const box =
        document.getElementById("addBox");


    if (box.style.display === "block") {

        box.style.display = "none";

    } else {

        box.style.display = "block";

    }

}


/* ==================================================
   إضافة عميل
================================================== */

function addCustomer() {

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();


    const address =
        document
        .getElementById("customerAddress")
        .value
        .trim();


    const notes =
        document
        .getElementById("customerNotes")
        .value
        .trim();


    if (!name) {

        showMessage(
            "اكتب اسم العميل أولًا",
            "error"
        );

        return;

    }


    if (!phone) {

        showMessage(
            "اكتب رقم الهاتف أولًا",
            "error"
        );

        return;

    }


    const customers =
        getCustomers();


    const customer = {

        id: getNextCustomerId(),

        name: name,

        phone: phone,

        address: address,

        notes: notes,

        createdAt:
            new Date().toISOString()

    };


    customers.push(customer);


    saveCustomers(customers);


    /* تنظيف الحقول */

    document
        .getElementById("customerName")
        .value = "";

    document
        .getElementById("customerPhone")
        .value = "";

    document
        .getElementById("customerAddress")
        .value = "";

    document
        .getElementById("customerNotes")
        .value = "";


    /* إخفاء النموذج */

    document
        .getElementById("addBox")
        .style.display = "none";


    displayCustomers();


    showMessage(
        "تم حفظ العميل بنجاح ✅",
        "success"
    );

}


/* ==================================================
   عرض العملاء
================================================== */

function displayCustomers() {

    const customers =
        getCustomers();


    const list =
        document.getElementById(
            "customersList"
        );


    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        customers.filter(customer => {

            return (

                String(customer.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(customer.phone || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(customer.id || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(customer.address || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    document
        .getElementById("customerCount")
        .textContent =
        customers.length;


    if (filtered.length === 0) {

        list.innerHTML = `

            <div class="empty">

                ${
                    customers.length === 0
                    ? "لا يوجد عملاء مسجلون حتى الآن 📋"
                    : "لا توجد نتائج مطابقة 🔎"
                }

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    filtered
        .slice()
        .reverse()
        .forEach(customer => {


            const card =
                document.createElement("div");


            card.className =
                "customer";


            card.innerHTML = `

                <div class="customer-name">

                    👤 ${escapeHTML(customer.name)}

                </div>


                <div class="customer-id">

                    🆔 رقم العميل:

                    <strong>
                        ${escapeHTML(customer.id)}
                    </strong>

                </div>


                <p>

                    📞 ${escapeHTML(customer.phone)}

                </p>


                <p>

                    📍
                    ${escapeHTML(
                        customer.address ||
                        "غير مسجل"
                    )}

                </p>


                ${
                    customer.notes
                    ?
                    `
                    <p>
                        📝
                        ${escapeHTML(customer.notes)}
                    </p>
                    `
                    :
                    ""
                }


                <button
                    class="delete-button"
                    onclick="deleteCustomer('${customer.id}')"
                >

                    🗑️ حذف العميل

                </button>

            `;


            list.appendChild(card);

        });

}


/* ==================================================
   حذف العميل
================================================== */

function deleteCustomer(id) {

    const customers =
        getCustomers();


    const customer =
        customers.find(
            item => item.id === id
        );


    if (!customer) {

        return;

    }


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف العميل؟\n\n" +
            customer.name
        );


    if (!confirmed) {

        return;

    }


    const updated =
        customers.filter(
            item => item.id !== id
        );


    saveCustomers(updated);


    displayCustomers();


    showMessage(
        "تم حذف العميل 🗑️",
        "success"
    );

}


/* ==================================================
   الرسائل
================================================== */

function showMessage(text, type) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    setTimeout(() => {

        message.style.display =
            "none";

    }, 2500);

}


/* ==================================================
   حماية النص
================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==================================================
   تشغيل الصفحة
================================================== */

displayCustomers();

</script>


</body>

</html>
