<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152f">
<title>إدارة العملاء - الورشة الفنية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:#07152f;color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0 0 7px;font-size:26px}
header p{margin:0;color:#dbe5ff}
.container{max-width:1050px;margin:auto;padding:16px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}
.search{background:#fff;border:1px solid #e0e5ec;border-radius:14px;padding:10px;display:flex;gap:8px}
.search input{width:100%;border:0;outline:0;padding:10px;background:transparent}
.btn{border:0;border-radius:10px;padding:12px 16px}
.primary{background:#16803c;color:#fff}.dark{background:#07152f;color:#fff}.gray{background:#5d6675;color:#fff}
.blue{background:#1565c0;color:#fff}.danger{background:#c62828;color:#fff}
.panel{background:#fff;border:1px solid #e0e5ec;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.panel h2{margin:0 0 15px;color:#07152f;font-size:20px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field.full{grid-column:1/-1}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cfd6df;border-radius:10px;outline:0;background:#fff}
.field textarea{min-height:85px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1565c0}
.form-actions{display:flex;gap:8px;margin-top:15px}
.form-actions .btn{flex:1}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e0e5ec;border-radius:14px;padding:14px;text-align:center}
.stat strong{display:block;font-size:24px;color:#07152f;margin-bottom:4px}
.stat span{font-size:13px;color:#667085}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.customer{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:16px;margin-bottom:12px}
.customer-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.customer-name{font-size:20px;font-weight:bold;color:#07152f}
.customer-id{font-size:12px;color:#667085;margin-top:4px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;background:#eef2f7;color:#344054}
.badge.active{background:#e5f7eb;color:#146c2e}
.badge.archived{background:#eee;color:#666}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.info{background:#f8fafc;border-radius:10px;padding:9px;font-size:14px;line-height:1.6}
.info b{display:block;color:#475467;font-size:12px}
.notes{margin-top:10px;padding:10px;border-right:3px solid #1565c0;background:#f5f8ff;border-radius:8px;line-height:1.7}
.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.empty{text-align:center;padding:30px;color:#667085;background:#fff;border:1px dashed #ccd3dc;border-radius:14px}
.message{display:none;padding:12px;border-radius:10px;margin-bottom:12px;text-align:center;font-weight:bold}
.success{background:#dff5e5;color:#146c2e}.error{background:#ffe2e2;color:#a00000}
.address-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.address-item{background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px;padding:10px}
.contact-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.small{font-size:12px;color:#667085}
@media(max-width:700px){
 .topbar{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .form-grid,.info-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .card-actions{grid-template-columns:1fr}
 .customer-top{flex-direction:column}
}
</style>
</head>
<body>

<header>
<h1>👥 إدارة العملاء</h1>
<p>الورشة الفنية لصيانة الأجهزة المنزلية والتكييف</p>
</header>

<div class="container">
<div id="message" class="message"></div>

<div class="topbar">
  <div class="search">
    <input id="searchInput" type="search" placeholder="🔎 ابحث بالاسم أو الهاتف أو رقم العميل أو العنوان">
    <button class="btn dark" id="searchBtn">بحث</button>
  </div>
  <button class="btn primary" id="newCustomerBtn">➕ عميل جديد</button>
</div>

<div class="stats">
  <div class="stat"><strong id="totalCount">0</strong><span>إجمالي العملاء</span></div>
  <div class="stat"><strong id="activeCount">0</strong><span>عملاء نشطون</span></div>
  <div class="stat"><strong id="archivedCount">0</strong><span>عملاء مؤرشفون</span></div>
  <div class="stat"><strong id="withAddressCount">0</strong><span>لديهم عنوان</span></div>
</div>

<section class="panel hidden" id="formPanel">
<h2 id="formTitle">➕ تسجيل عميل جديد</h2>

<div class="form-grid">
  <div class="field">
    <label>الاسم بالكامل *</label>
    <input id="name" type="text" placeholder="اسم العميل بالكامل">
  </div>
  <div class="field">
    <label>اسم الشهرة</label>
    <input id="nickname" type="text" placeholder="اختياري">
  </div>
  <div class="field">
    <label>رقم الهاتف الأساسي *</label>
    <input id="phone" type="tel" placeholder="010xxxxxxxx">
  </div>
  <div class="field">
    <label>رقم هاتف إضافي</label>
    <input id="phone2" type="tel" placeholder="اختياري">
  </div>
  <div class="field">
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" placeholder="اختياري">
  </div>
  <div class="field">
    <label>تصنيف العميل</label>
    <select id="category">
      <option value="عميل جديد">عميل جديد</option>
      <option value="عميل دائم">عميل دائم</option>
      <option value="عميل مميز">عميل مميز</option>
      <option value="عميل بعقد">عميل بعقد</option>
      <option value="عميل شركات">عميل شركات</option>
      <option value="عميل موقوف">عميل موقوف</option>
    </select>
  </div>
  <div class="field">
    <label>المحافظة</label>
    <input id="governorate" type="text" value="المنيا">
  </div>
  <div class="field">
    <label>المركز</label>
    <input id="center" type="text" value="مطاي">
  </div>
  <div class="field">
    <label>المدينة / القرية</label>
    <input id="city" type="text">
  </div>
  <div class="field">
    <label>العنوان التفصيلي</label>
    <input id="street" type="text" placeholder="الشارع / المنطقة / رقم المنزل">
  </div>
  <div class="field full">
    <label>ملاحظات عامة</label>
    <textarea id="notes" placeholder="أي ملاحظات مهمة عن العميل..."></textarea>
  </div>
</div>

<div class="form-actions">
  <button class="btn primary" id="saveBtn">💾 حفظ العميل</button>
  <button class="btn gray" id="cancelBtn">إلغاء</button>
</div>
</section>

<section class="panel">
<div class="list-head">
  <h2 style="margin:0">📋 ملف العملاء</h2>
  <span class="small" id="resultLabel">0 نتيجة</span>
</div>
<div id="customersList"></div>
</section>

<a href="index.html" class="btn dark" style="display:block;text-align:center;text-decoration:none">🏠 العودة إلى الرئيسية</a>
</div>

<script>
const CUSTOMERS_KEY = "customers";
const COUNTER_KEY = "customerCounter";
const SCHEMA_VERSION = 2;
const REQUESTS_KEY = "technical_workshop_requests";

let customers = [];
let editingId = null;

function safeParse(value, fallback){
  try { return value ? JSON.parse(value) : fallback; }
  catch(e){ return fallback; }
}

function getCustomers(){
  const raw = safeParse(localStorage.getItem(CUSTOMERS_KEY), []);
  return Array.isArray(raw) ? raw.map(normalizeCustomer) : [];
}

function saveCustomers(list){
  localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(list));
}

function normalizeCustomer(c){
  c = (c && typeof c === "object") ? c : {};
  const id = String(c.id || c.customerId || "");
  const addressText = c.address || c.location || "";
  const contacts = Array.isArray(c.contacts) ? c.contacts : [];
  const addresses = Array.isArray(c.addresses) ? c.addresses : [];

  if(addresses.length === 0 && addressText){
    addresses.push({
      id: "ADDR-" + Date.now() + "-" + Math.random().toString(36).slice(2,7),
      label: "العنوان الأساسي",
      governorate: c.governorate || "المنيا",
      center: c.center || "مطاي",
      city: c.city || "",
      street: addressText,
      isDefault: true
    });
  }

  const primaryPhone = c.phone || c.mobile || c.phoneNumber || "";
  if(primaryPhone && !contacts.some(x => x && x.value === primaryPhone)){
    contacts.unshift({type:"هاتف", value:primaryPhone, label:"أساسي"});
  }

  return {
    ...c,
    id: id || generateCustomerId(),
    name: c.name || c.customerName || c.fullName || "",
    nickname: c.nickname || c.alias || "",
    phone: primaryPhone,
    phone2: c.phone2 || c.alternativePhone || "",
    email: c.email || "",
    category: c.category || "عميل جديد",
    status: c.status || "active",
    governorate: c.governorate || "المنيا",
    center: c.center || "مطاي",
    city: c.city || "",
    address: addressText,
    addresses,
    contacts,
    notes: c.notes || "",
    stats: c.stats || {devices:0,workOrders:0,invoices:0,warranties:0,visits:0},
    createdAt: c.createdAt || new Date().toISOString(),
    updatedAt: c.updatedAt || c.createdAt || new Date().toISOString(),
    schemaVersion: SCHEMA_VERSION
  };
}

function generateCustomerId(){
  let counter = parseInt(localStorage.getItem(COUNTER_KEY) || "0", 10);
  counter++;
  localStorage.setItem(COUNTER_KEY, String(counter));
  return "CUS-" + String(counter).padStart(4,"0");
}

function migrateAndLoad(){
  const raw = safeParse(localStorage.getItem(CUSTOMERS_KEY), []);
  if(!Array.isArray(raw)) return [];
  const normalized = raw.map(normalizeCustomer);
  saveCustomers(normalized);
  return normalized;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showMessage(text,type="success"){
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "message " + type;
  el.style.display = "block";
  clearTimeout(window.msgTimer);
  window.msgTimer = setTimeout(()=>el.style.display="none",2800);
}

function resetForm(){
  editingId = null;
  document.getElementById("formTitle").textContent = "➕ تسجيل عميل جديد";
  document.getElementById("name").value = "";
  document.getElementById("nickname").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("phone2").value = "";
  document.getElementById("email").value = "";
  document.getElementById("category").value = "عميل جديد";
  document.getElementById("governorate").value = "المنيا";
  document.getElementById("center").value = "مطاي";
  document.getElementById("city").value = "";
  document.getElementById("street").value = "";
  document.getElementById("notes").value = "";
}

function openForm(customer=null){
  document.getElementById("formPanel").classList.remove("hidden");
  if(!customer){
    resetForm();
  }else{
    editingId = String(customer.id);
    document.getElementById("formTitle").textContent = "✏️ تعديل بيانات العميل";
    document.getElementById("name").value = customer.name || "";
    document.getElementById("nickname").value = customer.nickname || "";
    document.getElementById("phone").value = customer.phone || "";
    document.getElementById("phone2").value = customer.phone2 || "";
    document.getElementById("email").value = customer.email || "";
    document.getElementById("category").value = customer.category || "عميل جديد";
    document.getElementById("governorate").value = customer.governorate || "";
    document.getElementById("center").value = customer.center || "";
    document.getElementById("city").value = customer.city || "";
    document.getElementById("street").value = customer.address || "";
    document.getElementById("notes").value = customer.notes || "";
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

function closeForm(){
  document.getElementById("formPanel").classList.add("hidden");
  resetForm();
}

function duplicateCustomer(name,phone,ignoreId=null){
  const normalizedPhone = String(phone).replace(/\s+/g,"").trim();
  return customers.find(c =>
    String(c.id)!==String(ignoreId||"") &&
    normalizedPhone &&
    String(c.phone||"").replace(/\s+/g,"").trim()===normalizedPhone
  );
}

function saveCustomer(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  if(!name || !phone){
    showMessage("اكتب اسم العميل ورقم الهاتف الأساسي أولاً","error");
    return;
  }

  const duplicate = duplicateCustomer(name,phone,editingId);
  if(duplicate){
    showMessage("هذا الرقم مسجل بالفعل للعميل: " + duplicate.name,"error");
    return;
  }

  const now = new Date().toISOString();
  const governorate = document.getElementById("governorate").value.trim();
  const center = document.getElementById("center").value.trim();
  const city = document.getElementById("city").value.trim();
  const street = document.getElementById("street").value.trim();

  const data = {
    name,
    nickname: document.getElementById("nickname").value.trim(),
    phone,
    phone2: document.getElementById("phone2").value.trim(),
    email: document.getElementById("email").value.trim(),
    category: document.getElementById("category").value,
    governorate,
    center,
    city,
    address: street,
    notes: document.getElementById("notes").value.trim()
  };

  if(editingId){
    const index = customers.findIndex(c=>String(c.id)===String(editingId));
    if(index===-1){ showMessage("العميل غير موجود","error"); return; }
    customers[index] = {
      ...customers[index],
      ...data,
      updatedAt: now,
      schemaVersion: SCHEMA_VERSION
    };
    if(Array.isArray(customers[index].addresses) && customers[index].addresses.length){
      const def = customers[index].addresses.find(a=>a.isDefault) || customers[index].addresses[0];
      Object.assign(def,{governorate,center,city,street});
    }else if(street){
      customers[index].addresses=[{
        id:"ADDR-"+Date.now(),label:"العنوان الأساسي",
        governorate,center,city,street,isDefault:true
      }];
    }
    showMessage("تم تعديل بيانات العميل بنجاح ✅");
  }else{
    const customer = {
      id:generateCustomerId(),
      ...data,
      status:"active",
      addresses: street ? [{
        id:"ADDR-"+Date.now(),label:"العنوان الأساسي",
        governorate,center,city,street,isDefault:true
      }] : [],
      contacts:[
        {type:"هاتف",value:phone,label:"أساسي"},
        ...(data.phone2 ? [{type:"هاتف",value:data.phone2,label:"إضافي"}] : []),
        ...(data.email ? [{type:"بريد إلكتروني",value:data.email,label:"أساسي"}] : [])
      ],
      stats:{devices:0,workOrders:0,invoices:0,warranties:0,visits:0},
      createdAt:now,
      updatedAt:now,
      schemaVersion:SCHEMA_VERSION
    };
    customers.unshift(customer);
    showMessage("تم تسجيل العميل بنجاح ✅");
  }

  saveCustomers(customers);
  customers = getCustomers();
  closeForm();
  render();
}

function hasOperationalData(customerId){
  const requests = safeParse(localStorage.getItem(REQUESTS_KEY), []);
  if(!Array.isArray(requests)) return false;
  return requests.some(r =>
    String(r.customerId||"")===String(customerId) ||
    String(r.customerID||"")===String(customerId)
  );
}

function archiveCustomer(id){
  const c = customers.find(x=>String(x.id)===String(id));
  if(!c) return;
  c.status = "archived";
  c.updatedAt = new Date().toISOString();
  saveCustomers(customers);
  customers = getCustomers();
  render();
  showMessage("تمت أرشفة العميل بدل حذفه حفاظًا على السجل التشغيلي.");
}

function deleteOrArchiveCustomer(id){
  const c = customers.find(x=>String(x.id)===String(id));
  if(!c) return;

  if(hasOperationalData(id)){
    if(confirm("العميل مرتبط بطلبات صيانة. لا يُفضل حذفه.\nهل تريد أرشفته بدلًا من الحذف؟")){
      archiveCustomer(id);
    }
    return;
  }

  if(!confirm("هل أنت متأكد من حذف العميل؟\n\n"+c.name+"\n"+c.id)) return;
  customers = customers.filter(x=>String(x.id)!==String(id));
  saveCustomers(customers);
  render();
  showMessage("تم حذف العميل.");
}

function restoreCustomer(id){
  const c = customers.find(x=>String(x.id)===String(id));
  if(!c) return;
  c.status="active";
  c.updatedAt=new Date().toISOString();
  saveCustomers(customers);
  customers=getCustomers();
  render();
  showMessage("تمت إعادة تنشيط العميل.");
}

function customerAddress(c){
  const a = (c.addresses||[]).find(x=>x && x.isDefault) || (c.addresses||[])[0];
  if(a) return [a.governorate,a.center,a.city,a.street].filter(Boolean).join(" - ");
  return [c.governorate,c.center,c.city,c.address].filter(Boolean).join(" - ");
}

function renderStats(){
  document.getElementById("totalCount").textContent = customers.length;
  document.getElementById("activeCount").textContent = customers.filter(c=>c.status!=="archived").length;
  document.getElementById("archivedCount").textContent = customers.filter(c=>c.status==="archived").length;
  document.getElementById("withAddressCount").textContent = customers.filter(c=>customerAddress(c)).length;
}

function render(){
  renderStats();
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = customers.filter(c=>{
    if(!q) return true;
    const hay = [
      c.id,c.name,c.nickname,c.phone,c.phone2,c.email,
      c.category,c.governorate,c.center,c.city,c.address,customerAddress(c)
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });

  document.getElementById("resultLabel").textContent = filtered.length + " نتيجة";
  const list = document.getElementById("customersList");

  if(!filtered.length){
    list.innerHTML = '<div class="empty">لا توجد نتائج مطابقة 🔎</div>';
    return;
  }

  list.innerHTML = "";
  filtered.forEach(c=>{
    const div = document.createElement("article");
    div.className = "customer";
    const archived = c.status==="archived";
    const stats = c.stats || {};
    div.innerHTML = `
      <div class="customer-top">
        <div>
          <div class="customer-name">👤 ${escapeHTML(c.name || "بدون اسم")}</div>
          <div class="customer-id">🆔 ${escapeHTML(c.id)}</div>
        </div>
        <span class="badge ${archived?"archived":"active"}">${archived?"مؤرشف":"نشط"}</span>
      </div>

      <div class="info-grid">
        <div class="info"><b>📞 الهاتف الأساسي</b>${escapeHTML(c.phone||"غير مسجل")}</div>
        <div class="info"><b>📱 الهاتف الإضافي</b>${escapeHTML(c.phone2||"غير مسجل")}</div>
        <div class="info"><b>📍 العنوان</b>${escapeHTML(customerAddress(c)||"غير مسجل")}</div>
        <div class="info"><b>🏷️ التصنيف</b>${escapeHTML(c.category||"غير محدد")}</div>
        <div class="info"><b>📧 البريد الإلكتروني</b>${escapeHTML(c.email||"غير مسجل")}</div>
        <div class="info"><b>📅 تاريخ الإضافة</b>${escapeHTML(formatDate(c.createdAt))}</div>
      </div>

      <div class="info-grid">
        <div class="info"><b>🔧 الأجهزة</b>${Number(stats.devices||0)}</div>
        <div class="info"><b>🛠️ أوامر الشغل</b>${Number(stats.workOrders||0)}</div>
        <div class="info"><b>🧾 الفواتير</b>${Number(stats.invoices||0)}</div>
        <div class="info"><b>🛡️ الضمانات</b>${Number(stats.warranties||0)}</div>
      </div>

      ${c.notes ? `<div class="notes">📝 ${escapeHTML(c.notes)}</div>` : ""}

      <div class="card-actions">
        <button class="btn blue" data-action="edit" data-id="${escapeHTML(c.id)}">✏️ تعديل</button>
        <button class="btn ${archived?"primary":"gray"}" data-action="${archived?"restore":"archive"}" data-id="${escapeHTML(c.id)}">${archived?"♻️ تنشيط":"📦 أرشفة"}</button>
        <button class="btn danger" data-action="delete" data-id="${escapeHTML(c.id)}">🗑️ حذف</button>
      </div>`;
    list.appendChild(div);
  });
}

function formatDate(value){
  if(!value) return "غير معروف";
  const d = new Date(value);
  if(isNaN(d)) return String(value);
  return d.toLocaleDateString("ar-EG");
}

document.getElementById("newCustomerBtn").onclick=()=>openForm();
document.getElementById("cancelBtn").onclick=closeForm;
document.getElementById("saveBtn").onclick=saveCustomer;
document.getElementById("searchBtn").onclick=render;
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") render();
});

document.getElementById("customersList").addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn) return;
  const id=btn.dataset.id;
  const action=btn.dataset.action;
  const c=customers.find(x=>String(x.id)===String(id));
  if(action==="edit" && c) openForm(c);
  if(action==="archive") archiveCustomer(id);
  if(action==="restore") restoreCustomer(id);
  if(action==="delete") deleteOrArchiveCustomer(id);
});

customers = migrateAndLoad();
render();
</script>
