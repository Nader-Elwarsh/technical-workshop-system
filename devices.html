<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الأجهزة - الورشة الفنية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:Arial,Tahoma,sans-serif}
header{background:#07152f;color:#fff;padding:20px;text-align:center}.container{max-width:1100px;margin:auto;padding:16px}
.card,.device,.panel{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
h2{margin-top:0;color:#07152f}label{font-weight:bold;display:block;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3dd;border-radius:9px;font:inherit}textarea{min-height:90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
button,.back{border:0;border-radius:9px;padding:12px 14px;font:inherit;cursor:pointer}.back{display:block;background:#07152f;color:#fff;text-align:center;text-decoration:none;margin-bottom:16px}
.primary{background:#1769aa;color:#fff}.success{background:#16803c;color:#fff}.gray{background:#59616d;color:#fff}.amber{background:#9b6b00;color:#fff}.danger{background:#b42318;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.hidden{display:none!important}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef3f8;padding:12px;border-radius:10px;text-align:center}
.device{border-right:4px solid #1769aa}.badge{display:inline-block;background:#e8edf3;padding:5px 9px;border-radius:20px;margin:3px;font-size:13px}
.info{background:#eef6ff;border:1px solid #cfe2ff;border-radius:10px;padding:12px;line-height:1.8;margin-top:10px}
.warning{background:#fff6df;border:1px solid #e3c467;border-radius:10px;padding:12px;margin-top:10px}
.timeline{border-right:3px solid #cbd5e1;padding-right:14px}.stage{padding:8px 0}.done{font-weight:bold}.muted{color:#7b8492}.small{font-size:12px;color:#687386}
.search-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e7e9ed;padding:9px;text-align:right}
@media(max-width:700px){.grid,.summary,.search-grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body>
<header><h1>📱 إدارة الأجهزة</h1><div>الورشة الفنية لصيانة الأجهزة المنزلية والتكييف</div></header>
<div class="container">
<a class="back" href="index.html">🏠 الرئيسية</a>

<div id="summaryPanel" class="card">
<h2>📊 ملخص الأجهزة</h2>
<div class="summary">
<div class="stat"><b id="total">0</b><br><span class="small">إجمالي الأجهزة</span></div>
<div class="stat"><b id="active">0</b><br><span class="small">نشطة</span></div>
<div class="stat"><b id="archived">0</b><br><span class="small">مؤرشفة</span></div>
<div class="stat"><b id="types">0</b><br><span class="small">أنواع الأجهزة</span></div>
</div>
</div>

<div class="card"><button id="openRegister" class="primary" style="width:100%;font-size:17px">➕ تسجيل جهاز جديد</button></div>

<div id="registerPanel" class="card hidden">
<h2 id="formTitle">➕ تسجيل جهاز جديد</h2>
<div class="grid">
<div class="full"><label>العميل المالك *</label><select id="customer"></select><div id="customerInfo" class="info hidden"></div></div>
<div><label>نوع الجهاز *</label><select id="type"></select></div>
<div><label>الشركة المصنعة *</label><input id="brand"></div>
<div><label>الموديل</label><input id="model"></div>
<div><label>الرقم المسلسل</label><input id="serial"></div>
<div><label>سنة الصنع</label><input id="year" type="number"></div>
<div><label>اللون</label><input id="color"></div>
<div><label>مكان الاستخدام</label><input id="usage"></div>
<div><label>الحالة الحالية</label><select id="condition"><option>يعمل</option><option>يحتاج صيانة</option><option>خارج الخدمة</option><option>غير مستخدم</option><option>مؤرشف</option></select></div>
<div><label>نوع الفريون</label><input id="refrigerant"></div>
<div><label>القدرة / السعة</label><input id="capacity"></div>
<div><label>Inverter</label><select id="inverter"><option>غير محدد</option><option>نعم</option><option>لا</option></select></div>
<div class="full"><label>ملاحظات عامة</label><textarea id="notes"></textarea></div>
</div>
<div id="serialWarning" class="warning hidden"></div>
<div class="actions"><button id="save" class="success">💾 حفظ الجهاز</button><button id="cancel" class="gray">إلغاء</button></div>
</div>

<div id="searchPanel" class="card">
<h2>🔎 البحث عن الأجهزة</h2>
<div class="search-grid">
<input id="qDevice" placeholder="رقم الجهاز"><input id="qCustomer" placeholder="اسم العميل">
<input id="qType" placeholder="نوع الجهاز"><input id="qBrand" placeholder="الشركة المصنعة">
<input id="qModel" placeholder="الموديل"><input id="qSerial" placeholder="الرقم المسلسل">
<input id="qOrder" placeholder="رقم أمر الشغل"><input id="qInvoice" placeholder="رقم الفاتورة">
</div>
</div>

<div id="listPanel" class="card"><h2>📋 الأجهزة المسجلة <span id="count" class="badge"></span></h2><div id="list"></div></div>
<div id="detailPanel" class="card hidden"></div>
</div>

<script src="app-core.js"></script>
<script>
"use strict";
const C=window.WorkshopCore, ACTOR={id:"current-user",role:"manager",name:"مدير الاختبار"};
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let editingId=null;
function check(){if(!C)throw Error("لم يتم تحميل Core.");if(String(C.VERSION)!=="3.9.1-unified-customer-device")throw Error("إصدار Core غير متوافق مع وحدة الأجهزة.");}
function customers(){return C.list(C.KEYS.customers).filter(c=>!c.archived&&!c.mergedIntoCustomerId)}
function loadTypes(){const s=$("type");s.innerHTML='<option value="">اختر النوع</option>';C.deviceTypeList().forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent=t.name;s.appendChild(o)});if(!s.options.length||s.options.length===1){["ثلاجة","ديب فريزر","غسالة أوتوماتيك","غسالة فوق أوتوماتيك","غسالة عادية","تكييف","سخان","مبرد مياه","بوتاجاز","فرن"].forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;s.appendChild(o)})}}
function loadCustomers(){const s=$("customer");s.innerHTML='<option value="">اختر العميل</option>';customers().forEach(c=>{const o=document.createElement("option");o.value=C.idOf(c);o.textContent=C.customerName(c)+" — "+(c.phone||"");s.appendChild(o)})}
function showCustomer(){const c=C.findCustomer($("customer").value),b=$("customerInfo");if(!c){b.classList.add("hidden");return}b.innerHTML="👤 <b>"+esc(C.customerName(c))+"</b> — "+esc(C.idOf(c))+"<br>📱 عدد الأجهزة الحالية: "+C.customerDevices(c.id).length;b.classList.remove("hidden")}
function reset(){editingId=null;$("formTitle").textContent="➕ تسجيل جهاز جديد";$("save").textContent="💾 حفظ الجهاز";["customer","type","brand","model","serial","year","color","usage","condition","refrigerant","capacity","inverter","notes"].forEach(i=>$(i).value="");$("condition").value="يعمل";$("inverter").value="غير محدد";$("serialWarning").classList.add("hidden")}
function openRegister(){reset();$("registerPanel").classList.remove("hidden");$("summaryPanel").classList.add("hidden");$("searchPanel").classList.add("hidden");$("listPanel").classList.add("hidden");$("detailPanel").classList.add("hidden")}
function closeRegister(){ $("registerPanel").classList.add("hidden");$("summaryPanel").classList.remove("hidden");$("searchPanel").classList.remove("hidden");$("listPanel").classList.remove("hidden");render() }
function serialCheck(){const s=$("serial").value.trim().toLowerCase(),cid=$("customer").value,b=$("serialWarning");if(!s||!cid){b.classList.add("hidden");return}const hit=C.list(C.KEYS.devices).find(d=>String(d.id)!==String(editingId)&&String(d.serialNumber||d.serial||"").trim().toLowerCase()===s);if(!hit){b.classList.add("hidden");return}const same=String(hit.customerId||"")===String(cid);b.innerHTML=same?"⚠️ الرقم التسلسلي مسجل بالفعل لهذا العميل.":"⚠️ الرقم التسلسلي موجود على جهاز مرتبط بعميل آخر. هذا لا يعني أن العميلين نفس الشخص؛ سيبقى الأمر للمراجعة.";b.classList.remove("hidden")}
function save(){try{check();const d=C.saveDevice({id:editingId||undefined,customerId:$("customer").value,type:$("type").value,brand:$("brand").value.trim(),model:$("model").value.trim(),serialNumber:$("serial").value.trim(),manufactureYear:$("year").value,color:$("color").value.trim(),usageLocation:$("usage").value.trim(),condition:$("condition").value,refrigerant:$("refrigerant").value.trim(),capacity:$("capacity").value.trim(),inverter:$("inverter").value,notes:$("notes").value.trim(),generalNotes:$("notes").value.trim()},ACTOR);closeRegister();openDetail(d.id)}catch(e){alert(e.message||"تعذر الحفظ.")}}
function render(){const all=C.list(C.KEYS.devices),f=C.deviceSearch({deviceId:$("qDevice").value,customerName:$("qCustomer").value,type:$("qType").value,manufacturer:$("qBrand").value,model:$("qModel").value,serial:$("qSerial").value,workOrder:$("qOrder").value,invoice:$("qInvoice").value});$("total").textContent=all.length;$("active").textContent=all.filter(d=>!d.archived).length;$("archived").textContent=all.filter(d=>d.archived).length;$("types").textContent=C.deviceTypeList().length;$("count").textContent=f.length+" نتيجة";$("list").innerHTML=f.length?f.map(d=>{const c=C.findCustomer(d.customerId);return `<div class="device"><h3>📱 ${esc(d.brand||"جهاز")} — ${esc(d.type||"")}</h3><span class="badge">🆔 ${esc(d.id)}</span><span class="badge">👤 ${esc(c?C.customerName(c):"غير مرتبط")}</span><span class="badge">${esc(d.model||"—")}</span><div class="actions"><button class="primary" onclick="openDetail('${esc(d.id)}')">👁️ ملف الجهاز</button><button class="gray" onclick="edit('${esc(d.id)}')">✏️ تعديل</button></div></div>`}).join(""):'<div style="padding:25px;text-align:center;color:#777">لا توجد أجهزة مطابقة.</div>'}
function edit(id){const d=C.findDevice(id);if(!d)return;editingId=id;openRegister();$("formTitle").textContent="✏️ تعديل الجهاز";$("save").textContent="💾 حفظ التعديل";[["customer",d.customerId],["type",d.type],["brand",d.brand],["model",d.model],["serial",d.serialNumber||d.serial],["year",d.manufactureYear],["color",d.color],["usage",d.usageLocation],["condition",d.condition||"يعمل"],["refrigerant",d.refrigerant],["capacity",d.capacity],["inverter",d.inverter||"غير محدد"],["notes",d.generalNotes||d.notes]].forEach(([i,v])=>$(i).value=v||"");showCustomer();serialCheck()}
function openDetail(id){try{const x=C.device360(id),d=x.device,c=x.customer;$("summaryPanel").classList.add("hidden");$("searchPanel").classList.add("hidden");$("listPanel").classList.add("hidden");$("registerPanel").classList.add("hidden");$("detailPanel").classList.remove("hidden");$("detailPanel").innerHTML=`<h2>📱 الملف الفني للجهاز ${esc(d.id)}</h2><div class="info">👤 العميل: <b>${esc(c?C.customerName(c):"—")}</b> — ${esc(d.customerId||"—")}<br>📱 ${esc(d.type||"—")} / ${esc(d.brand||"—")} / ${esc(d.model||"—")}<br>🏷️ Serial: ${esc(d.serialNumber||"—")}<br>📌 الحالة: ${esc(d.condition||"—")}<br>📍 الاستخدام: ${esc(d.usageLocation||"—")}</div><h3>🔄 دورة الحياة</h3><div class="timeline">${x.lifecycle.map(s=>`<div class="stage ${s.status==="completed"?"done":"muted"}">${s.status==="completed"?"✅":"○"} المرحلة ${s.stage}: ${esc(s.name)}</div>`).join("")}</div><h3>📚 السجل الفني</h3><table><tr><th>العنصر</th><th>العدد</th></tr><tr><td>أوامر الشغل</td><td>${x.workOrders.length}</td></tr><tr><td>الزيارات</td><td>${x.visits.length}</td></tr><tr><td>الفواتير</td><td>${x.invoices.length}</td></tr><tr><td>الضمانات</td><td>${x.warranties.length}</td></tr><tr><td>العقود</td><td>${x.contracts.length}</td></tr><tr><td>المرفقات</td><td>${x.attachments.length}</td></tr></table><p>QR: <b>${x.qr?.enabled?"مفعل":"غير مفعل"}</b> — مركز المعرفة: <b>${x.knowledge.length}</b> سجل.</p><div class="actions"><button class="primary" onclick="location.href='customers.html#customer=${encodeURIComponent(d.customerId)}'">👤 فتح ملف العميل</button><button class="gray" onclick="edit('${esc(d.id)}')">✏️ تعديل</button><button class="gray" onclick="back()">📋 قائمة الأجهزة</button></div>`}catch(e){alert(e.message||"تعذر فتح الملف.")}}
function back(){$("detailPanel").classList.add("hidden");$("summaryPanel").classList.remove("hidden");$("searchPanel").classList.remove("hidden");$("listPanel").classList.remove("hidden");render()}
window.openDetail=openDetail;window.edit=edit;window.back=back;
try{check();loadTypes();loadCustomers();render();$("openRegister").onclick=openRegister;$("cancel").onclick=closeRegister;$("save").onclick=save;$("customer").onchange=()=>{showCustomer();serialCheck()};$("serial").oninput=serialCheck;["qDevice","qCustomer","qType","qBrand","qModel","qSerial","qOrder","qInvoice"].forEach(i=>$(i).oninput=render)}catch(e){alert(e.message||"تعذر تشغيل وحدة الأجهزة.");console.error(e)}
</script>
</body>
</html>
